<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Server Cat Tamagotchi</title>
  <style>
    /* Retro Terminal Aesthetic */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }

    .terminal-box {
      max-width: 550px;
      width: 100%;
      border: 2px solid #00ff33;
      padding: 25px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      box-sizing: border-box;
    }

    h1 { 
      font-size: 1.7rem; 
      margin-top: 0; 
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 10px;
    }

    /* Screen box containing the ASCII animal character art */
    .ascii-display {
      font-size: 1.5rem;
      font-weight: bold;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      white-space: pre;
      color: #00ff33;
      text-shadow: 0 0 8px #00ff33;
      transition: all 0.2s ease;
    }

    /* Live scrolling text stream log */
    .log-stream {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      color: #ffffff;
      text-align: left;
      line-height: 1.5;
      margin-bottom: 20px;
      height: 90px;
      overflow-y: auto;
    }

    .log-entry { margin-bottom: 4px; }
    .log-success { color: #ffcc00; font-weight: bold; }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .escape-btn {
      border: 2px solid #00ff33;
      box-shadow: 0 0 10px #00ff33;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <h1>🐱 ENTITY_ALERT: SERVER_CAT_FOUND</h1>
    <p style="color: #888; font-size: 0.9rem;">The webpage route failed. A tiny script entity is idling in the memory heap buffer. Interact with it to unblock routing.</p>
    
    <!-- ASCII character canvas frame -->
    <div class="ascii-display" id="cat-screen">(=-·-=) zZz</div>

    <!-- Live system feedback tracker box -->
    <div class="log-stream" id="log-box">
      <div class="log-entry">[SYSTEM] Anomaly sector opened. Target entity state: ASLEEP.</div>
    </div>

    <!-- Interface action array buttons rows -->
    <div class="btn-row" id="action-box">
      <button class="btn" onclick="interactWithServerCat('feed')">💾 SEND_DATA_PACKET.EXE</button>
      <button class="btn" onclick="interactWithServerCat('pet')">📡 PING_CORE.EXE</button>
    </div>

    <div class="btn-row">
      <a href="/" class="btn escape-btn hidden" id="escape-link">🚀 SYSTEM HAPPY: BOOT ESCAPE PATH</a>
    </div>
  </div>

  <script>
    const catScreen = document.getElementById('cat-screen');
    const logBox = document.getElementById('log-box');
    const actionBox = document.getElementById('action-box');
    const escapeLink = document.getElementById('escape-link');

    let interactions = 0;
    let isHappy = false;
    let audioCtx = null;

    // Generates a cozy synthetic cat purr frequency chip tone purely via Web Audio API
    function playPurrSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80 + Math.random() * 20, audioCtx.currentTime); // Low purr hz frequency
        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    function printTerminalLog(text, isAlert) {
      const entry = document.createElement('div');
      entry.className = "log-entry " + (isAlert ? "log-success" : "");
      entry.innerText = "[" + new Date().toLocaleTimeString() + "] " + text;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight; // Auto-scroll focus down
    }

    function interactWithServerCat(actionType) {
      if (isHappy) return;

      interactions++;
      playPurrSound();

      if (actionType === 'feed') {
        catScreen.innerText = "(=^·^=) *munch*";
        printTerminalLog("Entity consumed data packet. Buffer payload optimized.");
      } else if (actionType === 'pet') {
        catScreen.innerText = "(=*·*=) *purr*";
        printTerminalLog("Core pinged successfully. Entity resonance levels increasing.");
      }

      // Check win validation trigger threshold (3 interactions)
      if (interactions >= 3) {
        isHappy = true;
        actionBox.classList.add('hidden');
        escapeLink.classList.remove('hidden');

        catScreen.innerText = "💾 (=^🖏^=) 🚀";
        catScreen.style.color = "#ffffff";
        catScreen.style.textShadow = "0 0 15px #00ff33";
        printTerminalLog("MAX_AFFECTION_REACHED: Server Cat compiled the homepage bridge link!", true);
      } else {
        // Return back to static default idle position safely after brief animation frame window
        setTimeout(function() {
          if (!isHappy) {
            catScreen.innerText = "(=^·^=) *idle*";
          }
        }, 1000);
      }
    }
  </script>

</body>
</html>
