<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Terminal Fortune</title>
  <style>
    /* Retro Terminal Look - Responsive Design */
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-shadow: 0 0 3px #00ff33;
      text-align: center;
      touch-action: manipulation;
    }

    .terminal-box {
      width: 100%;
      max-width: 600px;
      border: 2px solid #00ff33;
      padding: 25px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      margin: 10px auto;
    }

    h1 { 
      font-size: clamp(1rem, 4vw, 2rem);
      margin: 0 0 15px 0;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      word-wrap: break-word;
      hyphens: auto;
    }

    /* Container für den dynamischen Prediction-Text */
    #fortune-text {
      font-size: clamp(0.9rem, 3.5vw, 1.6rem);
      color: #ffffff;
      margin: 20px 0;
      min-height: 60px;
      line-height: 1.5;
      word-wrap: break-word;
      hyphens: auto;
    }

    .subtext {
      font-size: clamp(0.7rem, 2.5vw, 0.9rem);
      color: #888;
      margin: 15px 0 25px 0;
      text-shadow: none;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 12px 18px;
      font-family: inherit;
      font-size: clamp(0.8rem, 3vw, 1.1rem);
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 3px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      text-decoration: none;
      transition: all 0.3s;
      min-width: 120px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
      font-weight: bold;
      text-shadow: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .escape-btn {
      border: 2px solid #00ff33;
    }

    /* Ultra Small Mobile (< 360px) */
    @media (max-width: 359px) {
      body {
        padding: 10px;
      }

      .terminal-box {
        padding: 15px;
        border-width: 1px;
      }

      .btn {
        min-width: 100%;
        padding: 14px 12px;
      }

      .btn-row {
        gap: 10px;
        flex-direction: column;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      .terminal-box {
        padding: 20px;
      }

      .btn {
        min-width: calc(50% - 6px);
      }
    }

    /* Tablet & larger mobile */
    @media (min-width: 481px) and (max-width: 768px) {
      .terminal-box {
        padding: 25px;
      }
    }

    /* Desktop */
    @media (min-width: 769px) {
      .terminal-box {
        padding: 30px;
        max-width: 600px;
      }

      .btn {
        min-width: auto;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn, * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <h1>🔮 HTTP_404: CORE_PREDICTION_ENGINE</h1>
    <p class="subtext">You are lost in the server mainframe. Let the system predict your dev-future:</p>
    
    <div id="fortune-text">Querying destiny matrix...</div>

    <div class="btn-row">
      <button class="btn" onclick="generatePrediction()">🎲 ROLL AGAIN</button>
      <a href="/GachaDeadlines/" class="btn escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    // Database of funny developer fortune teller quotes
    const predictions = [
      "Prediction: Your next pull request will be approved instantly without a single comment. (Highly rare event!)",
      "Prediction: Avoid editing production code directly today. The server deities seem deeply displeased with your cache.",
      "Prediction: A rogue semicolon is currently hiding in your code, waiting for you to deploy to production.",
      "Prediction: You will soon find the stack overflow answer that solves your exact problem, written by an anonymous hero in 2014.",
      "Prediction: The bug you have been chasing for three days is just a typo in a variable name. Check line 42.",
      "Prediction: Your coffee levels are critically low. Replenish immediately to avoid compile-time syntax errors.",
      "Prediction: A massive performance boost is coming to your local environment. Your RAM will thank you.",
      "Prediction: Someone will praise your clean indentation structure in the near future. Keep spacing."
    ];

    function generatePrediction() {
      const display = document.getElementById("fortune-text");
      
      const seed = Date.now() + Math.random();
      const idx = Math.floor((seed * 7) % predictions.length);
      
      display.innerText = predictions[idx];
    }

    // Initialize instantly on document loading
    generatePrediction();
  </script>

</body>
</html>
