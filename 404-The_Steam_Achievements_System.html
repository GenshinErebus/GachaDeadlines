<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Achievement Unlocked</title>
  <style>
    /* Retro Terminal Aesthetic */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
    }

    .terminal-box {
      max-width: 550px;
      width: 100%;
      border: 2px solid #00ff33;
      padding: 25px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      box-sizing: border-box;
      position: relative;
    }

    h1 { 
      font-size: 1.8rem; 
      margin-top: 0; 
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 10px;
    }

    .status-panel {
      font-size: 1.1rem;
      margin: 30px 0;
      min-height: 50px;
      line-height: 1.5;
      color: #ffffff;
    }

    /* Steam-style achievement popup box container */
    .achievement-popup {
      position: fixed;
      bottom: -100px; /* Hidden offscreen by default */
      right: 20px;
      width: 280px;
      background-color: #1e1e1e;
      border: 1px solid #ffaa00;
      border-radius: 4px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
      transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
      text-align: left;
      text-shadow: none;
    }

    .achievement-popup.slide-in {
      bottom: 20px;
    }

    /* Shift position upwards on tiny phone displays to center nicely */
    @media (max-width: 480px) {
      .achievement-popup {
        right: 5vw;
        width: 80vw;
      }
    }

    .badge-icon {
      font-size: 1.8rem;
      background-color: #2a2a2a;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ffaa00;
      box-shadow: 0 0 5px #ffaa00;
    }

    .achievement-text {
      color: #ffaa00;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .achievement-title {
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
      margin-top: 2px;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .escape-btn {
      border: 2px solid #ffaa00;
      color: #ffaa00;
      box-shadow: 0 0 10px #ffaa00;
    }
    .escape-btn:hover {
      background: #ffaa00;
      color: #050505;
      box-shadow: 0 0 20px #ffaa00;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body onclick="trackClicks()">

  <div class="terminal-box">
    <h1>🏆 SECTOR_404: TROPHY_ROOM</h1>
    
    <div class="status-panel" id="status-msg">
      The requested URL directory is empty.<br>
      Unlock the hidden exit criteria by exploring the environment boundary layer.
    </div>

    <div>
      <button class="btn" id="click-bait-btn">⚡ INTERACT_WITH_NODE.EXE</button>
      <a href="/" class="btn escape-btn hidden" id="escape-link">🚀 DEPLOY PLATINUM ESCAPE PATH</a>
    </div>
  </div>

  <!-- The Steam Achievement Notification UI layout -->
  <div class="achievement-popup" id="badge-popup">
    <div class="badge-icon" id="badge-emoji">🧭</div>
    <div>
      <div class="achievement-text">Achievement Unlocked!</div>
      <div class="achievement-title" id="badge-title">Lost in Space</div>
    </div>
  </div>

  <script>
    const statusMsg = document.getElementById('status-msg');
    const popup = document.getElementById('badge-popup');
    const badgeEmoji = document.getElementById('badge-emoji');
    const badgeTitle = document.getElementById('badge-title');
    const escapeLink = document.getElementById('escape-link');
    const baitBtn = document.getElementById('click-bait-btn');

    let clickCount = 0;
    let achievementsUnlocked = 0;
    
    let unlockedList = { lost: false, clicker: false, platinum: false };
    let audioCtx = null;

    // Synthetic synth tone generating a rewarding retro retro chime ding sound
    function playAchievementChime() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sine';
        // Classic pleasant major chord jump ring sequence
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
        
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch(e) {}
    }

    function triggerPopupNotification(emoji, title) {
      playAchievementChime();
      
      badgeEmoji.innerText = emoji;
      badgeTitle.innerText = title;
      popup.classList.add('slide-in');

      // Slide out window smoothly after 3.5 seconds
      setTimeout(function() {
        popup.classList.remove('slide-in');
      }, 3500);
    }

    function trackClicks() {
      if (unlockedList.platinum) return;

      clickCount++;

      // Trigger achievement #2 if the user clicks rapidly anywhere 5 times
      if (clickCount >= 5 && !unlockedList.clicker) {
        unlockedList.clicker = true;
        achievementsUnlocked++;
        triggerPopupNotification("⚡", "Impatient Clicker");
        checkWinCondition();
      }
    }

    function checkWinCondition() {
      // Trigger final master trophy once both hidden thresholds pass
      if (achievementsUnlocked === 2 && !unlockedList.platinum) {
        unlockedList.platinum = true;
        
        setTimeout(function() {
          triggerPopupNotification("👑", "Platinum: Found the Exit!");
          baitBtn.classList.add('hidden');
          escapeLink.classList.remove('hidden');
          statusMsg.innerHTML = "<span style='color: #ffaa00; font-weight: bold;'>100% COMPLETION: Security Matrix Overridden!</span><br>The final gate is compiled. Deploy completion package.";
        }, 4000);
      }
    }

    // Automated trigger for Achievement #1 (simply arriving on the broken URL link)
    window.onload = function() {
      setTimeout(function() {
        if (unlockedList.lost) return;
        unlockedList.lost = true;
        achievementsUnlocked++;
        triggerPopupNotification("🧭", "Lost in the Mainframe");
        statusMsg.innerHTML = "Trophies collected: 1 / 2<br>Keep probing the network matrix environment to reveal hidden blocks.";
      }, 800);
    };
  </script>

</body>
</html>
