<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Brute Force Protocol</title>
  <style>
    /* Retro Terminal Look */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      user-select: none;
      touch-action: manipulation;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90vw;
      max-width: 800px;
      height: 92vh;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      box-sizing: border-box;
      overflow: hidden;
    }

    .header-text {
      flex-shrink: 0;
      margin-bottom: 15px;
      line-height: 1.4;
      font-size: clamp(0.6rem, 2vw, 1.2rem);
    }

    /* Guess History Rows */
    .attempts-container {
      flex-grow: 1;
      flex-shrink: 1;
      min-height: 0;
      margin: 10px auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      padding-right: 5px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .attempt-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .digit-box {
      width: calc((100vw - 80px) / 4);
      max-width: 65px;
      min-width: 38px;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 2px solid #00ff33;
      border-radius: 4px;
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.9rem, 3.5vw, 1.8rem);
      font-weight: bold;
      color: #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    /* Feedback Colors */
    .digit-box.correct {
      background-color: #0c2c0e;
      border-color: #00ff33;
      box-shadow: 0 0 10px #00ff33;
      color: #00ff33;
    }

    .digit-box.wrong-place {
      background-color: #3a3000;
      border-color: #ffcc00;
      color: #ffcc00;
      text-shadow: 0 0 5px #ffcc00;
      box-shadow: 0 0 10px #ffcc00;
    }

    .digit-box.wrong {
      background-color: #221111;
      border-color: #ff3333;
      color: #ff3333;
      text-shadow: 0 0 5px #ff3333;
      box-shadow: 0 0 5px #ff3333;
    }

    .status-panel {
      flex-shrink: 0;
      font-size: clamp(0.7rem, 2vw, 1.2rem);
      margin: 8px 0;
      min-height: 20px;
    }

    /* Custom Mobile-Friendly Keypad */
    .keypad {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 280px;
      margin: 8px auto;
      padding: 8px 0;
      box-sizing: border-box;
    }

    .key {
      aspect-ratio: 1.2 / 1;
      background-color: #111;
      border: 1px solid #00ff33;
      color: #00ff33;
      font-family: inherit;
      font-size: clamp(0.7rem, 2.5vw, 1.5rem);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 3px rgba(0, 255, 51, 0.3);
      transition: all 0.1s;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key:active,
    .key:hover {
      background-color: #00ff33;
      color: #050505;
      box-shadow: 0 0 12px #00ff33;
      font-weight: bold;
    }

    .key.wide {
      grid-column: span 1;
      font-size: clamp(0.6rem, 2vw, 1.3rem);
    }

    /* Action Buttons */
    .btn-row {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: auto;
      padding-top: 10px;
      width: 100%;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 8px 16px;
      font-family: inherit;
      font-size: clamp(0.7rem, 2vw, 1.2rem);
      cursor: pointer;
      margin: 3px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* DESKTOP LAYOUT (Screens > 768px) */
    @media (min-width: 48.0625rem) {
      .digit-box {
        width: 65px;
      }

      .keypad {
        width: 260px;
      }
    }

/* MOBILE LAYOUT (Screens <= 768px) */
@media (max-width: 48rem) {
  .container {
    width: 96vw;
    height: 98vh;
  }

  .header-text {
    margin-bottom: 8px;
    font-size: clamp(0.55rem, 1.8vw, 1rem);
  }

  .attempts-container {
    gap: 4px;           /* Reduced from 6px */
    margin: 6px auto;   /* Reduced from 10px */
    max-height: none;   /* Remove any height limits */
  }

  .digit-box {
    width: calc((100vw - 50px) / 4);  /* Wider boxes = shorter overall grid */
    min-width: 36px;
    font-size: clamp(0.8rem, 3.5vw, 1.4rem);  /* Smaller text */
  }

  .status-panel {
    margin: 5px 0;
    font-size: clamp(0.65rem, 1.8vw, 1rem);
    min-height: 18px;
  }

  .keypad {
    gap: 4px;           /* Reduced from 6px */
    width: 85%;         /* Slightly narrower keypad */
    margin: 6px auto;
    padding: 5px 0;
  }

  .key {
    aspect-ratio: 1.1 / 1;  /* Shorter keys */
    font-size: clamp(0.65rem, 2.5vw, 1.2rem);
  }

  .btn-row {
    margin-top: auto;
    padding-top: 5px;   /* Reduced from 10px */
    gap: 5px;
  }

  .btn {
    padding: 5px 10px;  /* Smaller buttons */
    margin: 2px;
    font-size: clamp(0.6rem, 1.5vw, 1rem);
  }
}

/* ULTRA-MOBILE RESOLUTIONS (Screens <= 350px) ONLY */
@media (max-width: 21.875rem) {
  body {
    padding: 5px;  /* Minimal padding, not 0 - avoids edge clipping */
    overflow: auto;
  }

  .container {
    width: calc(100vw - 10px);
    height: auto;
    min-height: 90vh;
    padding: 5px;
    gap: 2px;
  }

  /* Shrunk header for mobile */
  .header-text {
    font-size: 0.35rem;
    margin-bottom: 3px;
    line-height: 1.1;
    flex-shrink: 0;
  }

  /* Compact attempts grid - smaller but all visible */
  .attempts-container {
    gap: 2px;
    margin: 2px auto;
    flex-shrink: 0;  /* Don't compress */
  }

  .attempt-row {
    gap: 2px;
    flex-shrink: 0;
  }

  .digit-box {
    width: 30px;      /* Fixed small size */
    height: 28px;     /* Slightly shorter = saves vertical space */
    font-size: 0.5rem;
    border-width: 1px;
    border-radius: 2px;
  }

  .status-panel {
    margin: 3px 0;
    font-size: 0.5rem;
    min-height: 12px;
    flex-shrink: 0;
  }

  .keypad {
    gap: 2px;
    width: 260px;      /* FIXED WIDTH - not 100% */
    margin: 4px auto;
    flex-shrink: 0;
  }

  .key {
    width: 75px;       /* Smaller buttons */
    height: 42px;      /* More compact */
    font-size: 0.55rem;
    border-radius: 4px;
  }

  .key.wide {
    font-size: 0.5rem;
  }

  .btn-row {
    gap: 4px;
    padding-top: 4px;
    flex-shrink: 0;
  }

  .btn {
    min-width: 90px;  /* Ensures button doesn't collapse */
    padding: 6px 10px;
    font-size: 0.5rem;
    flex-shrink: 0;
  }
}
  </style>
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [SECURITY] INTERCEPTED_ACCESS_ATTEMPT</div>
      <div>Firewall active. Brute-force the 4-digit verification code.</div>
    </div>

    <!-- 6 Tries Grid Container -->
    <div class="attempts-container" id="attempts-box"></div>

    <div class="status-panel" id="status-msg">Attempts remaining: 6</div>

    <!-- On-Screen Custom Hacker Keypad -->
    <div class="keypad" id="terminal-keypad">
      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key wide" data-val="del">DEL</button>
      <button class="key" data-val="0">0</button>
      <button class="key wide" data-val="ent">ENT</button>
    </div>

    <div class="btn-row">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT SYSTEM</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const attemptsContainer = document.getElementById('attempts-box');
    const statusMsg = document.getElementById('status-msg');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');
    const keypad = document.getElementById('terminal-keypad');

    const maxAttempts = 6;
    const codeLength = 4;

    let secretCode = [];
    let currentAttempt = 0;
    let currentGuess = [];
    let gameActive = true;

    function generateSecretCode() {
      secretCode = [];
      for (let i = 0; i < codeLength; i++) {
        secretCode.push(Math.floor(Math.random() * 10).toString());
      }
    }

    function createGrid() {
      attemptsContainer.innerHTML = '';
      for (let r = 0; r < maxAttempts; r++) {
        const row = document.createElement('div');
        row.className = 'attempt-row';
        row.id = `row-${r}`;

        for (let c = 0; c < codeLength; c++) {
          const box = document.createElement('div');
          box.className = 'digit-box';
          box.id = `box-${r}-${c}`;
          row.appendChild(box);
        }
        attemptsContainer.appendChild(row);
      }
    }

    function setupKeypad() {
      keypad.addEventListener('click', (e) => {
        if (!gameActive || !e.target.classList.contains('key')) return;

        const val = e.target.getAttribute('data-val');

        if (val === 'del') {
          handleDelete();
        } else if (val === 'ent') {
          handleSubmit();
        } else {
          handleNumberInput(val);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key >= '0' && e.key <= '9') handleNumberInput(e.key);
        if (e.key === 'Backspace') handleDelete();
        if (e.key === 'Enter') handleSubmit();
      });
    }

    function handleNumberInput(num) {
      if (currentGuess.length < codeLength) {
        currentGuess.push(num);
        updateVisualRow();
      }
    }

    function handleDelete() {
      if (currentGuess.length > 0) {
        currentGuess.pop();
        updateVisualRow();
      }
    }

    function updateVisualRow() {
      for (let c = 0; c < codeLength; c++) {
        const box = document.getElementById(`box-${currentAttempt}-${c}`);
        box.innerText = currentGuess[c] !== undefined ? currentGuess[c] : '';
      }
    }

    function handleSubmit() {
      if (currentGuess.length < codeLength) {
        statusMsg.innerText = "ERROR: Code length insufficient.";
        return;
      }

      let secretCopy = [...secretCode];
      let guessCopy = [...currentGuess];
      let rowStatuses = Array(codeLength).fill('wrong');

      // Pass 1: Exact matches
      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] === secretCopy[i]) {
          rowStatuses[i] = 'correct';
          secretCopy[i] = null;
          guessCopy[i] = null;
        }
      }

      // Pass 2: Partial matches (wrong place)
      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] !== null) {
          let matchIndex = secretCopy.indexOf(guessCopy[i]);
          if (matchIndex !== -1) {
            rowStatuses[i] = 'wrong-place';
            secretCopy[matchIndex] = null;
          }
        }
      }

      // Update grid box colors
      for (let i = 0; i < codeLength; i++) {
        const box = document.getElementById(`box-${currentAttempt}-${i}`);
        box.classList.add(rowStatuses[i]);
      }

      const isCorrect = rowStatuses.every(status => status === 'correct');

      if (isCorrect) {
        gameActive = false;
        statusMsg.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>ACCESS_GRANTED: Path Unlocked!</span>";
        escapeBtn.classList.remove('hidden');
        keypad.classList.add('hidden');
      } else {
        currentAttempt++;
        currentGuess = [];

        if (currentAttempt >= maxAttempts) {
          gameActive = false;
          statusMsg.innerHTML = `<span style='color: #ff3333;'>DECRYPTION_FAILED! PIN: ${secretCode.join('')}</span>`;
          resetBtn.classList.remove('hidden');
          keypad.classList.add('hidden');
        } else {
          statusMsg.innerText = `Attempts remaining: ${maxAttempts - currentAttempt}`;
        }
      }
    }

    function resetGame() {
      currentAttempt = 0;
      currentGuess = [];
      gameActive = true;
      statusMsg.innerText = `Attempts remaining: ${maxAttempts}`;
      escapeBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
      keypad.classList.remove('hidden');
      generateSecretCode();
      createGrid();
    }

    generateSecretCode();
    createGrid();
    setupKeypad();
  </script>

</body>

</html>
