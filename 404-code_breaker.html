<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Brute Force Protocol</title>
  <style>
    /* Retro Terminal Look */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      user-select: none;
      touch-action: manipulation;
    }

    .container {
      text-align: center;
      width: 99vw;
      height: 97vh;
    }

    .header-text {
      margin-bottom: 20px;
      line-height: 1.4;
      font-size: clamp(0.7rem, 2.2vw, 2.2rem);
    }

    /* Guess History Rows */
    .attempts-container {
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .attempt-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .digit-box {
      width: 65px;
      height: 65px;
      border: 2px solid #00ff33;
      border-radius: 4px;
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 2.6vw, 2.6rem);
      font-weight: bold;
      color: #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.3s ease;
    }

    /* Feedback Colors */
    .digit-box.correct {
      background-color: #0c2c0e;
      border-color: #00ff33;
      box-shadow: 0 0 10px #00ff33;
      color: #00ff33;
    }

    .digit-box.wrong-place {
      background-color: #3a3000;
      border-color: #ffcc00;
      color: #ffcc00;
      text-shadow: 0 0 5px #ffcc00;
      box-shadow: 0 0 10px #ffcc00;
    }

    .digit-box.wrong {
      background-color: #221111;
      border-color: #ff3333;
      color: #ff3333;
      text-shadow: 0 0 5px #ff3333;
      box-shadow: 0 0 5px #ff3333;
    }

    .status-panel {
      font-size: clamp(1.1rem, 2.6vw, 2.6rem);
      margin: 15px 0;
      min-height: 25px;
    }

    /* Custom Mobile-Friendly Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 40vw;
      margin: 20px auto;
    }

    .key {
      background-color: #111;
      border: 1px solid #00ff33;
      color: #00ff33;
      font-family: inherit;
      font-size: clamp(0.5rem, 2vw, 2rem);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 3px rgba(0, 255, 51, 0.3);
      transition: all 0.1s;
    }

    .key:active,
    .key:hover {
      background-color: #00ff33;
      color: #050505;
      box-shadow: 0 0 12px #00ff33;
      font-weight: bold;
    }

    .key.wide {
      grid-column: span 1;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Action Buttons */
    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: clamp(1rem, 2.5vw, 2.5rem);
      cursor: pointer;
      margin: 10px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [SECURITY] INTERCEPTED_ACCESS_ATTEMPT</div>
      <div>Firewall active. Brute-force the 4-digit verification code.</div>
    </div>

    <!-- 6 Tries Grid Container -->
    <div class="attempts-container" id="attempts-box"></div>

    <div class="status-panel" id="status-msg">Attempts remaining: 6</div>

    <!-- On-Screen Custom Hacker Keypad -->
    <div class="keypad" id="terminal-keypad">
      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key wide" data-val="del">DEL</button>
      <button class="key" data-val="0">0</button>
      <button class="key wide" data-val="ent">ENT</button>
    </div>

    <div>
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT SYSTEM</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const attemptsContainer = document.getElementById('attempts-box');
    const statusMsg = document.getElementById('status-msg');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');
    const keypad = document.getElementById('terminal-keypad');

    const maxAttempts = 6;
    const codeLength = 4;

    let secretCode = [];
    let currentAttempt = 0;
    let currentGuess = [];
    let gameActive = true;

    function generateSecretCode() {
      secretCode = [];
      for (let i = 0; i < codeLength; i++) {
        secretCode.push(Math.floor(Math.random() * 10).toString());
      }
    }

    function createGrid() {
      attemptsContainer.innerHTML = '';
      for (let r = 0; r < maxAttempts; r++) {
        const row = document.createElement('div');
        row.className = 'attempt-row';
        row.id = `row-${r}`;

        for (let c = 0; c < codeLength; c++) {
          const box = document.createElement('div');
          box.className = 'digit-box';
          box.id = `box-${r}-${c}`;
          row.appendChild(box);
        }
        attemptsContainer.appendChild(row);
      }
    }

    function setupKeypad() {
      keypad.addEventListener('click', (e) => {
        if (!gameActive || !e.target.classList.contains('key')) return;

        const val = e.target.getAttribute('data-val');

        if (val === 'del') {
          handleDelete();
        } else if (val === 'ent') {
          handleSubmit();
        } else {
          handleNumberInput(val);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key >= '0' && e.key <= '9') handleNumberInput(e.key);
        if (e.key === 'Backspace') handleDelete();
        if (e.key === 'Enter') handleSubmit();
      });
    }

    function handleNumberInput(num) {
      if (currentGuess.length < codeLength) {
        currentGuess.push(num);
        updateVisualRow();
      }
    }

    function handleDelete() {
      if (currentGuess.length > 0) {
        currentGuess.pop();
        updateVisualRow();
      }
    }

    function updateVisualRow() {
      for (let c = 0; c < codeLength; c++) {
        const box = document.getElementById(`box-${currentAttempt}-${c}`);
        box.innerText = currentGuess[c] !== undefined ? currentGuess[c] : '';
      }
    }

    function handleSubmit() {
      if (currentGuess.length < codeLength) {
        statusMsg.innerText = "ERROR: Code length insufficient.";
        return;
      }

      let secretCopy = [...secretCode];
      let guessCopy = [...currentGuess];
      let rowStatuses = Array(codeLength).fill('wrong');

      // Pass 1: Exact matches
      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] === secretCopy[i]) {
          rowStatuses[i] = 'correct';
          secretCopy[i] = null;
          guessCopy[i] = null;
        }
      }

      // Pass 2: Partial matches (wrong place)
      for (let i = 0; i < codeLength; i++) {
        if (guessCopy[i] !== null) {
          let matchIndex = secretCopy.indexOf(guessCopy[i]);
          if (matchIndex !== -1) {
            rowStatuses[i] = 'wrong-place';
            secretCopy[matchIndex] = null;
          }
        }
      }

      // Update grid box colors
      for (let i = 0; i < codeLength; i++) {
        const box = document.getElementById(`box-${currentAttempt}-${i}`);
        box.classList.add(rowStatuses[i]);
      }

      const isCorrect = rowStatuses.every(status => status === 'correct');

      if (isCorrect) {
        gameActive = false;
        statusMsg.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>ACCESS_GRANTED: Path Unlocked!</span>";
        escapeBtn.classList.remove('hidden');
        keypad.classList.add('hidden');
      } else {
        currentAttempt++;
        currentGuess = [];

        if (currentAttempt >= maxAttempts) {
          gameActive = false;
          statusMsg.innerHTML = `<span style='color: #ff3333;'>DECRYPTION_FAILED! PIN: ${secretCode.join('')}</span>`;
          resetBtn.classList.remove('hidden');
          keypad.classList.add('hidden');
        } else {
          statusMsg.innerText = `Attempts remaining: ${maxAttempts - currentAttempt}`;
        }
      }
    }

    function resetGame() {
      currentAttempt = 0;
      currentGuess = [];
      gameActive = true;
      statusMsg.innerText = `Attempts remaining: ${maxAttempts}`;
      escapeBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
      keypad.classList.remove('hidden');
      generateSecretCode();
      createGrid();
    }

    generateSecretCode();
    createGrid();
    setupKeypad();
  </script>

</body>

</html>
