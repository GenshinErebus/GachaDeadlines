<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Redirecting...</title>
    <script>
        // Prevent browser caching to ensure fresh execution on every visit
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
        
        const gamePages = [
            '404-chatbot.html',
            '404-code_breaker.html',
            '404-connect_four.html',
            '404-cookie-monster.html',
            '404-datastream.html',
            '404-endless_runner.html',
            '404-Excuse_Roulette.html',
            '404-false_terminal.html',
            '404-flappy_bird.html',
            '404-git_conflict.html',
            '404-hacker_wordle.html',
            '404-labyrinth.html',
            '404-linux_fortune_teller.html',
            '404-magnifier.html',
            '404-matrix_code_breaker.html',
            '404-matrix_rain.html',
            '404-memory.html',
            '404-minesweeper.html',
            '404-pong.html',
            '404-snake.html',
            '404-tetris.html',
            '404-tic_tac_toe.html',
            '404-tower_defense.html',
            '404-virus_invaders.html',
            '404-The_Endless_Knowledge_Labyrinth.html',
            '404-The_Star_Wars_Hyperspace.html',
            '404-Nerd-Trivia.html',
            '404-Server_Cat.html',
            '404-The_Rickroll_Protocol.html',
            '404-Virtual_Bubble_Wrap.html',
            '404-Rock-Paper-Scissors.html',
            '404-The_Aim_Trainer.html',
            '404-The_Cyberpunk_Dialog_System.html',
            '404-The_Steam_Achievements_System.html',
            '404-RPG_Questboard.html',
            '404-gacha_pull_simulator.html',
            '404-code_compiler.html',
            '404-dns_ping_pong.html',
            '404-javascript_garbage_collector.html',
            '404-Infinite_Loading_Illusion.html'
        ];
        
        // Fisher-Yates shuffle algorithm for better randomness distribution
        function shuffleArray(array) {
            const shuffled = [...array]; // Create a copy to avoid modifying original
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        // Pick a truly random game using enhanced shuffling method
        const shuffledGames = shuffleArray(gamePages);
        const randomGame = shuffledGames[0];
        
        // Extract repository name from URL path dynamically
        const pathSegments = window.location.pathname.split('/');
        const repoName = pathSegments[1]; // Grabs the correct repo name
        
        // Build the final absolute redirect URL
        const finalUrl = window.location.origin + '/' + repoName + '/' + randomGame;
        
        // Execute instant redirect without caching
        window.location.replace(finalUrl);
    </script>
</head>
<body>
</body>
</html>
