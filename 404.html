<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404</title>
</head>
<body bgcolor="#0a0a1a" text="#ffffff" style="font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh">
<script>
(function() {
    var games = [
        '404-aim.html',
        '404-bubble.html',
        '404-c4.html',
        '404-cat.html',
        '404-chatbot.html',
        '404-cipher.html',
        '404-cookie.html',
        '404-cyperpunk.html',
        '404-datastream.html',
        '404-dns.html',
        '404-excuse.html',
        '404-flappy.html',
        '404-fortune.html',
        '404-gacha.html',
        '404-garbage.html',
        '404-hacker.html',
        '404-hyperspace.html',
        '404-labyrinth.html',
        '404-magnifier.html',
        '404-maze.html',
        '404-memory.html',
        '404-mines.html',
        '404-pacman.html',
        '404-pong.html',
        '404-rain.html',
        '404-rickroll.html',
        '404-rpg.html',
        '404-rps.html',
        '404-runner.html',
        '404-snake.html',
        '404-steam.html',
        '404-td.html',
        '404-terminal.html',
        '404-tetris.html',
        '404-trivia.html',
        '404-ttt.html',
        '404-wordle.html'
    ];

    // Cryptographically secure random integer generator (0 to max - 1)
    function secureRandomInt(max) {
        if (window.crypto && window.crypto.getRandomValues) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] % max;
        } else {
            console.warn('⚠️ Crypto API not available, falling back to Math.random()');
            return Math.floor(Math.random() * max);
        }
    }

    // Fisher-Yates shuffle with cryptographically secure randomness
    function secureShuffle(array) {
        var arr = array.slice();
        var n = arr.length;
        while (n > 1) {
            var k = secureRandomInt(n);
            n--;
            var tmp = arr[n];
            arr[n] = arr[k];
            arr[k] = tmp;
        }
        return arr;
    }

    // Get games seen in recent visits (localStorage persists across sessions)
    function getRecentlySeen() {
        try {
            var data = localStorage.getItem('404_seen_games_history');
            return data ? JSON.parse(data) : [];
        } catch(e) {
            return [];
        }
    }

    // Mark current game as seen, keep only last 5 unique entries
    function markAsSeen(gameFile) {
        try {
            var seen = getRecentlySeen();
            seen = seen.filter(function(g) { return g !== gameFile; });
            seen.push(gameFile);
            if (seen.length > 5) {
                seen = seen.slice(seen.length - 5);
            }
            localStorage.setItem('404_seen_games_history', JSON.stringify(seen));
            console.log('📝 Updated seen games:', seen);
        } catch(e) {
            // Storage quota exceeded or disabled
        }
    }

    // Load a game with robust failover mechanism
    function loadGame(initialIndex) {
        var index = initialIndex || 0;
        var gameFile = games[index];
        var attemptCount = 0;
        var MAX_ATTEMPTS = Math.min(games.length, 8);
        var recentlySeen = getRecentlySeen();
        
        console.log('🎯 Games recently seen:', recentlySeen.length > 0 ? recentlySeen.length : 'none');

        function tryNextAttempt() {
            if (attemptCount >= MAX_ATTEMPTS) {
                console.error('⚠️ All', MAX_ATTEMPTS, 'attempts failed.');
                document.body.innerHTML = '<div style="text-align:center"><h1>404</h1><p>No games available right now.</p></div>';
                return;
            }
            
            // Prefer games NOT in recently seen list
            var candidates = games.filter(function(g) { 
                return recentlySeen.indexOf(g) === -1; 
            });
            
            if (candidates.length > 0) {
                // Pick from unseen games
                index = secureRandomInt(candidates.length);
                gameFile = candidates[index];
            } else {
                // Fallback: all games if too many recent visits
                index = secureRandomInt(games.length);
                gameFile = games[index];
            }
            
            attemptCount++;
            console.log('🔄 Attempt', attemptCount, '/ ' + MAX_ATTEMPTS + ':', gameFile);

            var xhr = new XMLHttpRequest();
            var timestamp = Date.now();
            
            xhr.open('GET', gameFile + '?_=' + timestamp, true);
            xhr.setRequestHeader('Cache-Control', 'no-cache');
            xhr.timeout = 5000;

            xhr.onload = function() {
                if (xhr.status === 200 && xhr.responseText.length > 500) {
                    console.log('✅ SUCCESSFULLY LOADED:', gameFile);
                    document.write(xhr.responseText);
                    document.close();
                    markAsSeen(gameFile); // Remember this was shown
                } else {
                    console.warn('❌ Failed:', gameFile, '- Status:', xhr.status);
                    tryNextAttempt();
                }
            };

            xhr.onerror = function() {
                console.warn('⚡ Network error:', gameFile);
                tryNextAttempt();
            };

            xhr.ontimeout = function() {
                console.warn('⏱️ Timeout:', gameFile);
                tryNextAttempt();
            };

            xhr.send();
        }

        // Start with truly randomized game
        var shuffledGames = secureShuffle(games);
        var randomStartIndex = secureRandomInt(shuffledGames.length);
        
        console.log('🎲 Shuffle starting at index:', randomStartIndex);
        tryNextAttempt();
    }

    // Initialize the game loader
    loadGame();
})();
</script>
</body>
</html>
