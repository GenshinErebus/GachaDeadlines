<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // List of custom game 404 pages
        const gamePages = [
            '/404-chatbot.html',
            '/404-code_breaker.html',
            '/404-connect_four.html',
            '/404-cookie-monster.html',
            '/404-datastream.html',
            '/404-endless_runner.html',

            '/404-tetris.html',
            '/404-tic_tac_toe.html',
            '/404-tower_defense.html',
