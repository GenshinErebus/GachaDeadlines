<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Hyperspace</title>
  <style>
    /* Fullscreen Sci-Fi Canvas */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      touch-action: none;
    }

    #space-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Floating retro console panel card - Kompakt für Maximalen Starfield-Effekt */
    .interface-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(5, 5, 5, 0.85);
      border: 2px solid #00ff33;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 25px rgba(0, 255, 51, 0.3);
      max-width: min(90vw, 420px);
      width: auto;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      color: #00ff33;
    }

    .overlay-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .overlay-text {
      color: #ffffff;
      font-size: 0.75rem;
      line-height: 1.4;
      text-shadow: none;
      word-wrap: break-word;
      margin-bottom: 15px;
    }

    .highlight-text {
      color: #00ff33;
      display: block;
      margin-top: 8px;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #00ff33;
      color: #000;
      box-shadow: 0 0 20px #00ff33;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      .interface-overlay {
        padding: 14px;
        max-width: min(95vw, 320px);
      }

      .overlay-title {
        font-size: 0.85rem;
        margin-bottom: 8px;
      }

      .overlay-text {
        font-size: 0.68rem;
        margin-bottom: 12px;
        line-height: 1.3;
      }

      .highlight-text {
        font-size: 0.68rem;
        margin-top: 6px;
      }

      .btn {
        padding: 8px 16px;
        font-size: 0.75rem;
        margin-top: 12px;
        min-height: 38px;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      .interface-overlay {
        padding: 16px;
        max-width: min(92vw, 350px);
      }

      .overlay-title {
        font-size: 0.9rem;
        margin-bottom: 10px;
      }

      .overlay-text {
        font-size: 0.72rem;
        margin-bottom: 14px;
      }

      .btn {
        padding: 9px 18px;
        font-size: 0.8rem;
        margin-top: 14px;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      .interface-overlay {
        padding: 18px;
        max-width: min(85vw, 400px);
      }

      .overlay-title {
        font-size: 0.95rem;
        margin-bottom: 10px;
      }

      .overlay-text {
        font-size: 0.75rem;
        margin-bottom: 14px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.85rem;
        margin-top: 15px;
      }
    }

    /* Desktop (769px+) */
    @media (min-width: 769px) {
      .interface-overlay {
        padding: 20px;
        max-width: min(80vw, 420px);
      }

      .overlay-title {
        font-size: 1rem;
        margin-bottom: 10px;
      }

      .overlay-text {
        font-size: 0.75rem;
        margin-bottom: 15px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.85rem;
        margin-top: 15px;
      }
    }

    /* Large Desktop (1200px+) */
    @media (min-width: 1200px) {
      .interface-overlay {
        padding: 22px;
        max-width: min(75vw, 440px);
      }

      .overlay-title {
        font-size: 1.05rem;
        margin-bottom: 12px;
      }

      .overlay-text {
        font-size: 0.78rem;
        margin-bottom: 16px;
      }

      .btn {
        padding: 11px 22px;
        font-size: 0.9rem;
        margin-top: 16px;
      }
    }

    /* Extra Large Desktop (1600px+) */
    @media (min-width: 1600px) {
      .interface-overlay {
        padding: 24px;
        max-width: min(70vw, 460px);
      }

      .overlay-title {
        font-size: 1.1rem;
        margin-bottom: 12px;
      }

      .overlay-text {
        font-size: 0.8rem;
        margin-bottom: 16px;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.95rem;
        margin-top: 16px;
      }
    }
  </style>
</head>

<body>

  <div id="space-container">
    <canvas id="starfieldCanvas"></canvas>
    
    <!-- Central Sci-Fi Terminal Interface Overlaid -->
    <div class="interface-overlay">
      <div class="overlay-title">⚠️ WARP_FACTOR_404</div>
      <div class="overlay-text">
        Navigation index database error. Sector route is completely unmapped.
        <span class="highlight-text">[Move pointer / Drag screen to initiate lightspeed navigation override]</span>
      </div>
      <a href="/GachaDeadlines/" class="btn">🚀 EXIT HYPERSPACE &amp; RETURN</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('starfieldCanvas');
    const ctx = canvas.getContext('2d');

    function resizeContainer() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeContainer();
    window.addEventListener('resize', resizeContainer);

    const totalStars = 150;
    let starsList = [];
    let speedFactor = 1;
    let targetSpeedFactor = 1;
    let animationActive = true;

    function initStarfieldGrid() {
      starsList = [];
      for (let i = 0; i < totalStars; i++) {
        starsList.push({
          x: Math.random() * canvas.width - canvas.width / 2,
          y: Math.random() * canvas.height - canvas.height / 2,
          z: Math.random() * canvas.width,
          color: "rgba(255, 255, 255, " + (Math.random() * 0.5 + 0.5) + ")"
        });
      }
    }

    function activateWarpSpeed() {
      targetSpeedFactor = 25;
    }

    function deactivateWarpSpeed() {
      targetSpeedFactor = 1;
    }

    window.addEventListener('mousedown', activateWarpSpeed);
    window.addEventListener('mouseup', deactivateWarpSpeed);
    window.addEventListener('mouseenter', activateWarpSpeed);
    window.addEventListener('mouseleave', deactivateWarpSpeed);

    window.addEventListener('touchstart', function(e) {
      if (e.target.tagName !== 'A') {
        activateWarpSpeed();
      }
    }, { passive: true });

    window.addEventListener('touchend', deactivateWarpSpeed);

    function renderCosmicMotion() {
      if (!animationActive) return;

      ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      speedFactor += (targetSpeedFactor - speedFactor) * 0.08;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      for (let i = 0; i < starsList.length; i++) {
        let s = starsList[i];
        
        s.z -= speedFactor;

        if (s.z <= 0) {
          s.x = Math.random() * canvas.width - centerX;
          s.y = Math.random() * canvas.height - centerY;
          s.z = canvas.width;
        }

        const px = (s.x / s.z) * centerX + centerX;
        const py = (s.y / s.z) * centerY + centerY;

        const tailZ = s.z + speedFactor * 2;
        const tx = (s.x / tailZ) * centerX + centerX;
        const ty = (s.y / tailZ) * centerY + centerY;

        ctx.strokeStyle = s.color;
        ctx.lineWidth = Math.max(1, (1 - s.z / canvas.width) * 3);
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(px, py);
        ctx.stroke();
      }

      requestAnimationFrame(renderCosmicMotion);
    }

    initStarfieldGrid();
    renderCosmicMotion();
  </script>

</body>
</html>
