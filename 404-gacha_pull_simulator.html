<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lootbox Grid System</title>
  <style>
    /* Dark Cyber Premium Aesthetics */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }

    .gacha-box {
      max-width: 500px;
      width: 100%;
      border: 2px solid #00ff33;
      padding: 25px;
      border-radius: 8px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      box-sizing: border-box;
    }

    h1 { 
      font-size: 1.8rem; 
      margin-top: 0; 
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 10px;
    }

    /* Screen container simulating the drop reward display card */
    .gacha-screen {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 20px;
      border-radius: 6px;
      margin: 20px 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    /* Pull tier highlights classes */
    .stars-3 { color: #888; text-shadow: none; }
    .stars-4 { color: #a335ee; text-shadow: 0 0 8px #a335ee; }
    .stars-5 { color: #ff9900; text-shadow: 0 0 15px #ff9900; font-weight: bold; animation: glow 1s infinite alternate; }

    @keyframes glow {
      from { text-shadow: 0 0 10px #ff9900; }
      to { text-shadow: 0 0 25px #ff9900, 0 0 35px #ffffff; }
    }

    .currency-counter {
      font-size: 1rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .escape-btn {
      border: 2px solid #ff9900;
      color: #ff9900;
      box-shadow: 0 0 10px #ff9900;
    }
    .escape-btn:hover {
      background: #ff9900;
      color: #050505;
      box-shadow: 0 0 20px #ff9900;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="gacha-box">
    <h1>🎟️ BANNER_SUMMON: ERROR_404</h1>
    <p style="color: #888; font-size: 0.9rem;">The page route is missing. Spend your remaining server crystals to roll for a legendary 5-Star escape link.</p>
    
    <div class="currency-counter">Crystals: <span id="gems-display">160</span> 💎</div>

    <!-- The central drop card window area -->
    <div class="gacha-screen" id="drop-screen">
      <div style="color: #888;">[Awaiting transmission scan...]</div>
    </div>

    <div class="btn-row" id="action-area">
      <button class="btn" onclick="executeGachaPull()">✦ SUMMON x1 (160 Gems)</button>
    </div>

    <div class="btn-row">
      <a href="/" class="btn escape-btn hidden" id="escape-link">🚀 USE SSR HOMEPAGE LINK (5★)</a>
    </div>
  </div>

  <script>
    const screen = document.getElementById('drop-screen');
    const gemsDisplay = document.getElementById('gems-display');
    const actionArea = document.getElementById('action-area');
    const escapeLink = document.getElementById('escape-link');

    let gems = 160;
    let pullCount = 0;

    // Item tier lists databases mapping typical gacha drops
    const drops3Star = [
      "3★ Trash: [Orphaned Semicolon ;]",
      "3★ Trash: [Corrupted Favicon.ico]",
      "3★ Trash: [Broken Image Placeholder Link]",
      "3★ Trash: [Deprecated HTML Font Tag]",
      "3★ Trash: [Unused CSS Variable Block]"
    ];

    const drops4Star = [
      "4★ SR Item: [Functional 404 Stylesheet]",
      "4★ SR Item: [Server Morale Boost Joke Token]",
      "4★ SR Item: [Localstorage Cache Cleaner script]"
    ];

    function executeGachaPull() {
      if (gems < 160) return;

      pullCount++;
      
      // Update currency display counter values
      gemsDisplay.innerText = "0";

      // Simulated computing thinking state
      screen.innerHTML = "<div style='color: #ffcc00;'>Summoning data packets...</div>";
      actionArea.classList.add('hidden');

      setTimeout(function() {
        // Pity system rule: Click #3 guarantees the legendary 5-star drop item
        if (pullCount >= 3) {
          screen.innerHTML = "<div class='stars-5'>★★★★★</div>" +
                             "<div class='stars-5' style='font-size: 1.25rem; margin-top: 10px;'>SSR DROP: [SECURE_HOMEPAGE_GATEWAY]</div>";
          escapeLink.classList.remove('hidden');
          return;
        }

        // RNG calculation logic roll (90% for 3-star, 10% for 4-star)
        const roll = Math.random() * 100;
        
        if (roll < 90) {
          const item = drops3Star[Math.floor(Math.random() * drops3Star.length)];
          screen.innerHTML = "<div class='stars-3'>★★★</div><div class='stars-3' style='margin-top:10px;'>" + item + "</div>";
        } else {
          const item = drops4Star[Math.floor(Math.random() * drops4Star.length)];
          screen.innerHTML = "<div class='stars-4'>★★★★</div><div class='stars-4' style='margin-top:10px;'>" + item + "</div>";
        }

        // Give the player free premium currency back to push them towards the pity banner limit
        gems = 160;
        gemsDisplay.innerText = gems;
        actionArea.classList.remove('hidden');

      }, 1000);
    }
  </script>

</body>
</html>
