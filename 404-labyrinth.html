<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Network Maze</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-labyrinth.css">
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [CRITICAL] 404_ROUTE_NOT_FOUND</div>
      <div>Guide the data packet to the exit node.</div>
    </div>

    <div class="maze-grid" id="maze"></div>

    <div id="status"></div>

    <div class="dpad-container">
      <div class="dpad-row">
        <button class="dpad-btn" id="btn-up">▲</button>
      </div>
      <div class="dpad-row">
        <button class="dpad-btn" id="btn-left">◀</button>
        <button class="dpad-btn" id="btn-down">▼</button>
        <button class="dpad-btn" id="btn-right">▶</button>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn hidden" id="reset-btn" onclick="generateNewMaze()">🔄 NEW MAZE</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 ESCAPE</a>
    </div>
  </div>

  <!-- Script -->
  <script src="404-labyrinth.js"></script>
</body>
</html>
