<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sector Disrupted</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 0;
      margin: 0;
      text-shadow: 0 0 5px #00ff33;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      padding: clamp(8px, 3vw, 30px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 3vw, 25px);
      min-height: 100vh;
    }

    .header-text {
      text-align: center;
      line-height: 1.3;
      word-wrap: break-word;
      padding: 0 clamp(3px, 2vw, 15px);
      max-width: 100%;
    }

    .header-text div:first-child {
      font-size: clamp(0.7rem, 5vw, 1.8rem);
      margin-bottom: clamp(2px, 1.5vw, 8px);
      letter-spacing: 0.5px;
    }

    .header-text div:nth-child(2) {
      font-size: clamp(0.6rem, 3.5vw, 0.95rem);
      opacity: 0.9;
    }

    .header-text div:last-child {
      font-size: clamp(0.6rem, 3.5vw, 0.9rem);
      opacity: 0.85;
      font-style: italic;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(4px, 1.5vw, 10px);
      width: clamp(200px, 90vw, 500px);
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 280px);
    }

    .cell {
      background-color: #111;
      border: 2px solid #00ff33;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 8vw, 2.5rem);
      font-weight: bold;
      color: #00ff33;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      touch-action: manipulation;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background-color: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .cell.taken {
      cursor: not-allowed;
      background-color: #111 !important;
      color: #00ff33 !important;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2) !important;
    }

    .status {
      font-size: clamp(0.65rem, 3.5vw, 1rem);
      text-align: center;
      min-height: 1.2em;
      padding: clamp(3px, 1.5vw, 10px);
      width: 100%;
      max-width: 500px;
      word-wrap: break-word;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(6px, 2vw, 15px);
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 0 clamp(5px, 2vw, 15px);
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: clamp(6px, 2vw, 12px) clamp(10px, 2.5vw, 20px);
      font-family: inherit;
      font-size: clamp(0.65rem, 3vw, 0.95rem);
      cursor: pointer;
      border-radius: 3px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      flex: 1 1 auto;
      min-width: 110px;
      text-align: center;
      white-space: normal;
      word-break: break-word;
      line-height: 1.2;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (<380px height) */
    @media (max-height: 380px), (max-width: 350px) {
      .container {
        padding: 5px;
        gap: 5px;
        justify-content: flex-start;
      }

      .header-text {
        padding: 0 5px;
      }

      .header-text div:first-child {
        font-size: 0.75rem;
        margin-bottom: 3px;
      }

      .header-text div:nth-child(2),
      .header-text div:last-child {
        font-size: 0.6rem;
        line-height: 1.2;
      }

      .board {
        width: 260px;
        gap: 3px;
        max-height: 200px;
      }

      .cell {
        font-size: 1rem;
        border-radius: 3px;
        border-width: 1.5px;
      }

      .status {
        font-size: 0.65rem;
        padding: 3px;
        min-height: 1em;
      }

      .button-group {
        gap: 5px;
        padding: 0 5px;
        margin-top: 5px;
      }

      .btn {
        padding: 5px 8px;
        font-size: 0.65rem;
        min-width: 90px;
        max-width: 47%;
      }
    }

    /* Small Mobile (381-480px height) */
    @media (min-height: 381px) and (max-height: 480px) {
      .board {
        width: 280px;
        max-height: 220px;
      }

      .cell {
        font-size: 1.2rem;
      }

      .btn {
        min-width: 100px;
        padding: 6px 10px;
      }
    }

    /* Medium Mobile (481-700px height) */
    @media (min-height: 481px) and (max-width: 600px) {
      .container {
        gap: 10px;
      }

      .board {
        width: 320px;
      }

      .cell {
        font-size: 1.5rem;
      }
    }

    /* Tablet */
    @media (min-width: 601px) and (max-width: 1023px) {
      .container {
        justify-content: center;
        max-width: 800px;
      }

      .board {
        width: 420px;
      }

      .cell {
        font-size: 2rem;
      }

      .header-text div:first-child {
        font-size: 1.8rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .container {
        max-width: 1200px;
        justify-content: center;
      }

      .board {
        width: 550px;
      }

      .cell {
        font-size: 2.8rem;
      }

      .header-text div:first-child {
        font-size: 2.2rem;
      }
    }

    /* Large Desktop */
    @media (min-width: 1440px) {
      .board {
        width: 650px;
      }

      .container {
        max-width: 1400px;
      }

      .cell {
        font-size: 3.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [CRITICAL] 404_PAGE_NOT_FOUND</div>
      <div>The coordinates you requested do not exist.</div>
      <div>Defeat the AI grid-sentinel to unlock the escape protocol.</div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="status" id="status">Your turn, User (X)...</div>

    <div class="button-group">
      <button class="btn" id="reset-btn">Reset Grid</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const resetBtn = document.getElementById('reset-btn');
    const escapeBtn = document.getElementById('escape-btn');

    let gameState = ["", "", "", "", "", "", "", "", ""];
    let isGameActive = true;
    const humanPlayer = "X";
    const aiPlayer = "O";

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    resetBtn.addEventListener('click', resetGame);

    function handleCellClick(e) {
      const clickedCell = e.target;
      const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

      if (gameState[clickedCellIndex] !== "" || !isGameActive) return;

      makeMove(clickedCell, clickedCellIndex, humanPlayer);
      
      if (!checkWin(humanPlayer) && !checkDraw()) {
        statusText.innerText = "AI processing next step...";
        isGameActive = false; 
        setTimeout(aiMove, 400); 
      }
    }

    function makeMove(cell, index, player) {
      gameState[index] = player;
      cell.innerText = player;
      cell.classList.add('taken');
    }

    function aiMove() {
      let move = findBestMove(aiPlayer) ?? findBestMove(humanPlayer) ?? pickRandomMove();

      if (move !== null) {
        const targetCell = document.querySelector(`[data-index="${move}"]`);
        makeMove(targetCell, move, aiPlayer);
      }

      isGameActive = true;

      if (!checkWin(aiPlayer)) {
        checkDraw();
      }
    }

    function findBestMove(player) {
      for (let condition of winningConditions) {
        let count = 0;
        let emptyIndex = null;
        for (let index of condition) {
          if (gameState[index] === player) count++;
          else if (gameState[index] === "") emptyIndex = index;
        }
        if (count === 2 && emptyIndex !== null) return emptyIndex;
      }
      return null;
    }

    function pickRandomMove() {
      let emptyCells = [];
      gameState.forEach((val, idx) => { if (val === "") emptyCells.push(idx); });
      if (emptyCells.length === 0) return null;
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function checkWin(player) {
      let roundWon = false;
      for (let i = 0; i < winningConditions.length; i++) {
        const winCondition = winningConditions[i];
        let a = gameState[winCondition[0]];
        let b = gameState[winCondition[1]];
        let c = gameState[winCondition[2]];
        if (a === '' || b === '' || c === '') continue;
        if (a === b && b === c && a === player) {
          roundWon = true;
          break;
        }
      }

      if (roundWon) {
        isGameActive = false;
        if (player === humanPlayer) {
          statusText.innerHTML = "<span style='color: #00ff33;'>SUCCESS: Sentinel bypassed!</span>";
        } else {
          statusText.innerHTML = "<span style='color: #ff3333;'>FAILURE: Sentinel wins. Try again.</span>";
        }
        unlockEscape();
        return true;
      }
      return false;
    }

    function checkDraw() {
      if (!gameState.includes("")) {
        statusText.innerText = "TIE: Draw state achieved. Good enough.";
        isGameActive = false;
        unlockEscape();
        return true;
      }
      if (isGameActive && gameState.includes("")) {
        statusText.innerText = "Your turn, User (X)...";
      }
      return false;
    }

    function unlockEscape() {
      escapeBtn.classList.remove('hidden');
    }

    function resetGame() {
      gameState = ["", "", "", "", "", "", "", "", ""];
      isGameActive = true;
      statusText.innerText = "Your turn, User (X)...";
      cells.forEach(cell => {
        cell.innerText = "";
        cell.classList.remove('taken');
      });
    }
  </script>

</body>
</html>
