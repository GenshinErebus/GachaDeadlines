<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Stack Overflow (Tetris)</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-tetris.css">
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [STACK_OVERFLOW] DATA BLOCK SECTOR CORRUPTED</div>
      <div>Clear data rows to de-fragment the system block index.</div>
    </div>

    <div class="score-board">
      ROWS CLEARED: <span id="current-score">0</span> / 2
    </div>

    <canvas id="tetrisCanvas" width="240" height="480"></canvas>

    <div class="controls-container">
      <button class="ctrl-btn" id="left-btn">◀</button>
      <button class="ctrl-btn" id="rotate-btn">↻</button>
      <button class="ctrl-btn" id="drop-btn">▼</button>
      <button class="ctrl-btn" id="right-btn">▶</button>
    </div>

    <div class="button-area">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">RESET TERMINAL</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>
  <!-- Script -->
  <script src="404-tetris.js"></script>
</body>
</html>
