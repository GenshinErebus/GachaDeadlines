<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Network Miner</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-mines.css">
</head>
<body>

  <div class="header-text">
    <div>⚠️ [SECTOR_BREACH] CORRUPTED_NETWORK_NODES</div>
    <div>Detect and isolate malicious data packets without triggering a crash.</div>
  </div>

  <div class="status-panel" id="status-msg">Safe sectors left: 54</div>

  <!-- The 8x8 Grid Map -->
  <div class="grid" id="minefield"></div>

  <!-- Mode Toggle Buttons -->
  <div class="mode-row">
    <button class="btn active-mode" id="mode-reveal-btn">🔍 REVEAL</button>
    <button class="btn" id="mode-flag-btn">🚩 FLAG VIRUS</button>
  </div>

  <!-- Action Buttons (Reset + Escape) -->
  <div class="mode-row btn-row-actions">
    <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT INTERFACE</button>
    <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
  </div>

  <!-- Script -->
  <script src="404-mines.js"></script>
</body>
</html>
