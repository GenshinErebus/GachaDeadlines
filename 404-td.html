<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Data Defender Protocol</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-td.css">
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [DDOS_ATTACK] GATEWAY FLOOD (404)</div>
      <div>Deploy filter nodes near the path to block the breach.</div>
      <div>Tap green squares to deploy a node (Cost: 20 Bits).</div>
    </div>

    <div class="score-board">
      <div>BITS:<span id="bits-count">40</span></div>
      <div>FILT:<span id="filtered-count">0</span>/10</div>
      <div>INT:<span id="integrity-count">100</span>%</div>
    </div>

    <div class="grid-board" id="main-board">
      <div class="path-tile"></div>
      <div class="path-tile"></div>
      <div class="path-tile"></div>
    </div>

    <div class="terminal-msg" id="terminal-msg"></div>

    <div class="button-group">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 ESCAPE.EXE</a>
    </div>
  </div>

  <!-- Script -->
  <script src="404-td.js"></script>
</body>
</html>
