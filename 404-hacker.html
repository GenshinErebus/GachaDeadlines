<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Brute Force Protocol</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-hacker.css">
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [SECURITY] INTERCEPTED_ACCESS_ATTEMPT</div>
      <div>Firewall active. Brute-force the 4-digit verification code.</div>
    </div>

    <!-- 6 Tries Grid Container -->
    <div class="attempts-container" id="attempts-box"></div>

    <div class="status-panel" id="status-msg">Attempts remaining: 6</div>

    <!-- On-Screen Custom Hacker Keypad -->
    <div class="keypad" id="terminal-keypad">
      <button class="key" data-val="1">1</button>
      <button class="key" data-val="2">2</button>
      <button class="key" data-val="3">3</button>
      <button class="key" data-val="4">4</button>
      <button class="key" data-val="5">5</button>
      <button class="key" data-val="6">6</button>
      <button class="key" data-val="7">7</button>
      <button class="key" data-val="8">8</button>
      <button class="key" data-val="9">9</button>
      <button class="key wide" data-val="del">DEL</button>
      <button class="key" data-val="0">0</button>
      <button class="key wide" data-val="ent">ENT</button>
    </div>

    <div class="btn-row">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT SYSTEM</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <!-- Script -->
  <script src="404-hacker.js"></script>

</body>

</html>
