<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Grid Disrupted (Pong)</title>
  <style>
    /* Retro Terminal Look - Fully Responsive */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-shadow: 0 0 3px #00ff33;
      touch-action: none;
      user-select: none;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header-text {
      margin-bottom: 8px;
      line-height: 1.3;
      font-size: 0.65rem;
      text-align: center;
      max-width: 95vw;
    }

    .header-text div {
      line-height: 1.25;
    }

    /* Game Canvas - Responsive scaling handled by JS */
    canvas {
      background-color: #111;
      border: 2px solid #00ff33;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.3);
      display: block;
      margin: 6px auto;
      max-width: 100%;
      height: auto;
      cursor: none;
    }

    .score-board {
      font-size: 0.7rem;
      margin: 6px 0;
      text-shadow: 0 0 4px #00ff33;
    }

    /* Action Buttons */
    .btn {
      background: transparent;
      border: 1.5px solid #00ff33;
      color: #00ff33;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      margin: 8px 0;
      border-radius: 4px;
      text-shadow: 0 0 3px #00ff33;
      box-shadow: 0 0 4px rgba(0, 255, 51, 0.3);
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
      font-weight: bold;
      text-shadow: none;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      body {
        padding: 5px;
        padding-bottom: 10px;
      }

      .header-text {
        font-size: 0.55rem;
        margin-bottom: 6px;
      }

      .header-text div {
        font-size: 0.5rem;
        line-height: 1.2;
      }

      .score-board {
        font-size: 0.55rem;
        margin: 4px 0;
      }

      canvas {
        margin: 4px auto;
        border-width: 1.5px;
      }

      .btn {
        font-size: 0.6rem;
        padding: 7px 12px;
        min-height: 32px;
        width: 100%;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 8px;
        padding-bottom: 12px;
      }

      .header-text {
        font-size: 0.65rem;
        margin-bottom: 8px;
      }

      .score-board {
        font-size: 0.65rem;
        margin: 5px 0;
      }

      .btn {
        font-size: 0.65rem;
        padding: 8px 14px;
        min-height: 34px;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      body {
        padding: 14px;
      }

      .header-text {
        font-size: 0.9rem;
        margin-bottom: 10px;
      }

      .score-board {
        font-size: 0.9rem;
        margin: 8px 0;
      }

      .btn {
        font-size: 0.85rem;
        padding: 10px 18px;
        min-height: 40px;
      }
    }

    /* Desktop (769px+) - Canvas nutzt Screen maximal aus */
    @media (min-width: 769px) {
      body {
        padding: 20px;
      }

      .header-text {
        font-size: clamp(1rem, 2vw, 1.4rem);
        margin-bottom: 12px;
      }

      .score-board {
        font-size: clamp(0.95rem, 2vw, 1.3rem);
        margin: 10px 0;
      }

      canvas {
        border-width: 3px;
      }

      .btn {
        font-size: clamp(0.95rem, 2vw, 1.25rem);
        padding: 12px 22px;
        min-height: 46px;
        min-width: 200px;
      }
    }

    /* Large Desktop (1200px+) */
    @media (min-width: 1200px) {
      body {
        padding: 30px;
      }

      .header-text {
        font-size: clamp(1.2rem, 1.8vw, 1.7rem);
        margin-bottom: 16px;
      }

      .score-board {
        font-size: clamp(1.1rem, 1.6vw, 1.5rem);
        margin: 12px 0;
      }

      .btn {
        font-size: clamp(1.1rem, 1.6vw, 1.4rem);
        padding: 14px 26px;
        min-height: 52px;
        min-width: 240px;
      }
    }

    /* Short landscape viewports */
    @media (max-height: 500px) and (orientation: landscape) {
      .header-text {
        margin-bottom: 6px;
      }

      .header-text div {
        font-size: 0.6rem;
      }

      .score-board {
        margin: 4px 0;
      }

      .btn {
        min-height: 38px;
        padding: 8px 16px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [CRITICAL] 404_PAGE_NOT_FOUND</div>
      <div>Drag your finger/mouse to control the paddle.</div>
    </div>

    <div class="score-board">
      USER: <span id="user-score">0</span> | AI: <span id="ai-score">0</span>
    </div>

    <!-- The Game Screen - Dynamic sizing via JS -->
    <canvas id="pongCanvas"></canvas>

    <div>
      <a href="/GachaDeadlines/" class="btn" id="escape-btn">🚀 ESCAPE</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    const userScoreEl = document.getElementById('user-score');
    const aiScoreEl = document.getElementById('ai-score');
    const escapeBtn = document.getElementById('escape-btn');

    // Game objects configurations
    const paddleWidth = 10;
    const paddleHeight = 80;
    const ballRadius = 7;

    let user = { x: 15, y: 0, score: 0 };
    let ai = { x: 0, y: 0, score: 0 };
    let ball = { x: 0, y: 0, speedX: 4, speedY: 4, speedMultiplier: 1.05 };

    // --- RESPONSIVE CANVAS RESIZER ---
    function resizeCanvas() {
      // Get viewport dimensions minus paddings
      const maxWidth = Math.min(window.innerWidth - 24, window.innerWidth * 0.95);
      const maxHeight = window.innerHeight - 200; // Reserve space for header + buttons
      
      // Aspect ratio preserved from original 600x400 = 1.5:1
      let targetWidth, targetHeight;

      if (window.innerWidth >= 1200) {
        // Large Desktop: Canvas bis zu 75vh, max 1100px
        targetHeight = Math.min(window.innerHeight * 0.70, 1100 / 1.5);
        targetWidth = targetHeight * 1.5;
      } else if (window.innerWidth >= 769) {
        // Desktop: ~70vh, max 780px
        targetHeight = Math.min(window.innerHeight * 0.68, 780 / 1.5);
        targetWidth = targetHeight * 1.5;
      } else if (window.innerWidth >= 481) {
        // Tablet: ~60vh
        targetHeight = Math.min(window.innerHeight * 0.60, 500 / 1.5);
        targetWidth = targetHeight * 1.5;
      } else {
        // Mobile: bis zu 95vw Breite
        targetWidth = Math.min(window.innerWidth - 20, 300);
        targetHeight = targetWidth / 1.5;
      }

      // Set logical canvas size (internal resolution)
      canvas.width = Math.floor(targetWidth);
      canvas.height = Math.floor(targetHeight);

      // Update game object positions
      user.x = canvas.width * 0.025;
      ai.x = canvas.width - canvas.width * 0.025 - paddleWidth;
      user.y = canvas.height / 2 - paddleHeight / 2;
      ai.y = canvas.height / 2 - paddleHeight / 2;
      
      // Ball resets to new center
      if (!isGameRunning) {
        resetBall();
      }
    }

    // --- RESPONSIVE CONTROLS SYSTEM ---

    function processInputY(clientY) {
      const rect = canvas.getBoundingClientRect();
      const relativeY = clientY - rect.top;
      const canvasScaleFactor = canvas.height / rect.height;
      const targetCanvasY = relativeY * canvasScaleFactor;
      
      user.y = Math.max(0, Math.min(canvas.height - paddleHeight, targetCanvasY - paddleHeight / 2));
    }

    canvas.addEventListener('mousemove', (e) => {
      processInputY(e.clientY);
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault(); 
      if (e.touches.length > 0) {
        processInputY(e.touches[0].clientY);
      }
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length > 0) {
        processInputY(e.touches[0].clientY);
      }
    }, { passive: false });

    // --- BASE PONG ENGINE ---

    let isGameRunning = false;

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.speedX = Math.random() > 0.5 ? 4 : -4; 
      ball.speedY = (Math.random() * 2 - 1) * 3;
    }

    function checkCollision(b, p) {
      return b.x + ballRadius > p.x && 
             b.x - ballRadius < p.x + paddleWidth && 
             b.y + ballRadius > p.y && 
             b.y - ballRadius < p.y + paddleHeight;
    }

    function update() {
      ball.x += ball.speedX;
      ball.y += ball.speedY;

      if (ball.y - ballRadius < 0 || ball.y + ballRadius > canvas.height) {
        ball.speedY = -ball.speedY;
      }

      const aiTarget = ball.y - paddleHeight / 2;
      ai.y += (aiTarget - ai.y) * 0.12; 
      ai.y = Math.max(0, Math.min(canvas.height - paddleHeight, ai.y)); 

      let player = (ball.x < canvas.width / 2) ? user : ai;

      if (checkCollision(ball, player)) {
        ball.speedX = -ball.speedX * ball.speedMultiplier;
        let hitPoint = ball.y - (player.y + paddleHeight / 2);
        hitPoint = hitPoint / (paddleHeight / 2); 
        ball.speedY = hitPoint * 5;
      }

      if (ball.x - ballRadius < 0) {
        ai.score++;
        aiScoreEl.innerText = ai.score;
        resetBall();
      } else if (ball.x + ballRadius > canvas.width) {
        user.score++;
        userScoreEl.innerText = user.score;
        resetBall();
      }
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 255, 51, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.fillStyle = '#00ff33';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00ff33';

      ctx.fillRect(user.x, user.y, paddleWidth, paddleHeight);
      ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);
      
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      if (isGameRunning) {
        update();
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Start game on first user interaction
    function startGame() {
      if (!isGameRunning) {
        isGameRunning = true;
        escapeBtn.style.opacity = '0.6';
      }
    }

    canvas.addEventListener('click', startGame);
    canvas.addEventListener('touchstart', startGame, { passive: true });

    // Initialize
    resizeCanvas();
    resetBall();
    gameLoop();
    isGameRunning = false; // Wait for user input

    // Resize listener
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        resizeCanvas();
      }, 150);
    });
  </script>
</body>
</html>
