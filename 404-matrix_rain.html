<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Wake up, Neo...</title>
  <style>
    /* Absolute Fullscreen Matrix Look */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
      touch-action: none; /* Prevents zooming/scrolling while tapping the Matrix */
    }

    /* Container for the interactive clickable words hidden in the matrix */
    #matrix-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Secret words styling to blend into the falling code */
    .hidden-word {
      position: absolute;
      color: #00ff33;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      white-space: nowrap;
      text-shadow: 0 0 8px #00ff33;
      transform: translate(-50%, -50%);
      padding: 10px; /* Expands touch target area on smartphones */
    }

    .hidden-word:hover {
      color: #ffffff;
      text-shadow: 0 0 15px #00ff33, 0 0 25px #ffffff;
    }

    /* Win state system overlay panel */
    .overlay-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(5, 5, 5, 0.9);
      border: 2px solid #00ff33;
      border-radius: 6px;
      padding: 25px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 0 25px rgba(0, 255, 51, 0.4);
      max-width: 90vw;
      width: 320px;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      color: #00ff33;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #00ff33;
      color: #000;
      box-shadow: 0 0 15px #00ff33;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="matrix-container">
    <canvas id="matrixCanvas"></canvas>
    <!-- Hidden word element generated dynamically by JavaScript -->
    <div id="target-word" class="hidden-word"></div>
  </div>

  <!-- Escape overlay panel revealed only when word is clicked -->
  <div class="overlay-panel hidden" id="win-screen">
    <div style="font-weight: bold; margin-bottom: 10px; font-size: 1.1rem;">⚡ MATRIX_BREACH_SUCCESS ⚡</div>
    <div style="color: #ffffff; font-size: 0.9rem; line-height: 1.4;">You found the anomaly in the code. The system pathway is open.</div>
    <a href="/" class="btn">🚀 RUN RETURNING_HOME.EXE</a>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('matrix-container');
    const targetWordEl = document.getElementById('target-word');
    const winScreen = document.getElementById('win-screen');

    // Make canvas fully responsive to fill viewport screen dimensions
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Matrix characters mapping strings safely
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-/<>[]{}";
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize) + 1;
    const rainDrops = Array(columns).fill(1);

    // Target tracking keywords database
    const secretKeywords = ["HOME", "EXIT", "BACK", "404", "NEO", "GATEWAY", "ESCAPE"];
    let activeWord = "";
    let wordX = 0;
    let wordY = 0;
    let isGameOver = false;

    function generateNewTargetWord() {
      if (isGameOver) return;
      
      activeWord = secretKeywords[Math.floor(Math.random() * secretKeywords.length)];
      
      // Compute random grid column and vertical boundaries safely
      const randomCol = Math.floor(Math.random() * (columns - 4)) + 2;
      wordX = randomCol * fontSize;
      wordY = Math.floor(Math.random() * (canvas.height - 200)) + 100;

      // Update structural element bindings
      targetWordEl.innerText = activeWord;
      targetWordEl.style.left = wordX + 'px';
      targetWordEl.style.top = wordY + 'px';
      targetWordEl.classList.remove('hidden');

      // Re-shuffle coordinates automatically every 4 seconds if not clicked
      setTimeout(generateNewTargetWord, 4000);
    }

    // Connect interactions directly to the word link trigger
    function handleWordDiscovery() {
      if (isGameOver) return;
      isGameOver = true;
      
      targetWordEl.classList.add('hidden');
      winScreen.classList.remove('hidden');

      // Visual freeze matrix effect setup
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    targetWordEl.addEventListener('click', handleWordDiscovery);
    targetWordEl.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleWordDiscovery();
    }, { passive: false });

    // Core Canvas digital code rain rendering engine loop
    function renderMatrixStream() {
      if (isGameOver) return;

      // Creates trailing fade out shadow blur overlay layer
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff33';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet[Math.floor(Math.random() * alphabet.length)];
        const x = i * fontSize;
        const y = rainDrops[i] * fontSize;

        // Skip rendering regular characters inside the secret word bounding box area
        const isInsideWordWidth = x >= (wordX - 40) && x <= (wordX + 40);
        const isInsideWordHeight = y >= (wordY - 15) && y <= (wordY + 15);

        if (!(isInsideWordWidth && isInsideWordHeight)) {
          ctx.fillText(text, x, y);
        }

        // Reset drop tracking loop once it hits bottom screen thresholds randomly
        if (y > canvas.height && Math.random() * 100 > 97.5) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }

      requestAnimationFrame(renderMatrixStream);
    }

    // Launch configuration engine setup
    generateNewTargetWord();
    renderMatrixStream();
  </script>

</body>
</html>
