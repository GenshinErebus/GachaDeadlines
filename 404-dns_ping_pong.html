<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - DNS Connection Error</title>
  <style>
    /* Retro Terminal Aesthetic */
    * {
      box-sizing: border-box;
    }
    
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: auto;
      width: 100%;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .terminal-box {
      max-width: 550px;
      width: 100%;
      border: 2px solid #00ff33;
      padding: 20px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 8px;
      line-height: 1.2;
    }

    /* Live scrolling network trace terminal stream log */
    .log-terminal {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #ffffff;
      text-align: left;
      line-height: 1.4;
      margin: 12px 0;
      height: 140px;
      overflow-y: auto;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-fail {
      color: #ff3333;
      text-shadow: 0 0 5px #ff3333;
    }

    .log-success {
      color: #00ff33;
      font-weight: bold;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      text-decoration: none;
      transition: all 0.1s ease;
      min-width: 120px;
    }

    /* Active click button push flash feedback state */
    .btn:active {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .escape-btn {
      border: 2px solid #00ff33;
      box-shadow: 0 0 10px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    p {
      color: #888;
      font-size: 0.85rem;
      margin: 8px 0;
      line-height: 1.3;
    }

    /* ============================================
       DESKTOP LAYOUT (Screens > 768px / 48rem)
       Maximum width utilization
       ============================================ */
    @media (min-width: 48.0625rem) {
      body {
        min-height: 100vh;
        justify-content: center;
        padding: 30px 60px;
        display: flex;
      }
      
      .terminal-box {
        width: 85vw;
        max-width: 950px;
        padding: 45px;
        margin: 25px auto;
      }
      
      h1 {
        font-size: 2.2rem;
        margin-bottom: 18px;
        padding-bottom: 10px;
      }
      
      p {
        font-size: 1.1rem;
        margin: 12px 0;
      }
      
      .log-terminal {
        height: 305px;
        padding: 18px;
        font-size: 1rem;
        margin: 18px 0;
      }
      
      .btn {
        padding: 16px 32px;
        font-size: 1.1rem;
        min-width: 200px;
      }
      
      .btn-row {
        gap: 15px;
        margin-top: 18px;
      }
    }

    /* ============================================
       TABLET / LARGE MOBILE (480px - 768px)
       ============================================ */
    @media (min-width: 30rem) and (max-width: 48rem) {
      body {
        padding: 12px;
      }
      
      .terminal-box {
        width: 92vw;
        padding: 18px;
      }
      
      h1 {
        font-size: 1.3rem;
        margin-bottom: 10px;
      }
      
      p {
        font-size: 0.8rem;
      }
      
      .log-terminal {
        height: 130px;
        padding: 10px;
        font-size: 0.8rem;
        margin: 10px 0;
      }
      
      .btn {
        padding: 8px 16px;
        font-size: 0.85rem;
        min-width: 130px;
      }
      
      .btn-row {
        gap: 6px;
        margin-top: 10px;
      }
    }

    /* ============================================
       MOBILE LAYOUT (Screens ≤ 480px / 30rem)
       No scroll needed - fits in viewport
       ============================================ */
    @media (max-width: 30rem) {
      body {
        padding: 6px;
        height: 100vh;
      }
      
      .terminal-box {
        width: 96vw;
        padding: 14px;
        margin: 4px auto;
      }
      
      h1 {
        font-size: 1.1rem;
        margin-bottom: 8px;
        padding-bottom: 6px;
      }
      
      p {
        font-size: 0.75rem;
        margin: 6px 0;
      }
      
      .log-terminal {
        height: 110px;
        padding: 8px;
        font-size: 0.75rem;
        margin: 8px 0;
      }
      
      .btn {
        padding: 8px 14px;
        font-size: 0.8rem;
        min-width: 110px;
      }
      
      .btn-row {
        gap: 4px;
        margin-top: 8px;
      }
    }

    /* ============================================
       ULTRA-MOBILE / MINI (Screens ≤ 320px / 20rem)
       Compact layout - no scrolling
       ============================================ */
    @media (max-width: 20rem) {
      body {
        padding: 3px;
        height: 100vh;
      }
      
      .terminal-box {
        width: 98vw;
        padding: 10px;
        margin: 2px auto;
      }
      
      h1 {
        font-size: 0.95rem;
        margin-bottom: 6px;
        padding-bottom: 4px;
        word-break: break-word;
      }
      
      p {
        font-size: 0.7rem;
        margin: 4px 0;
      }
      
      .log-terminal {
        height: 90px;
        padding: 6px;
        font-size: 0.7rem;
        margin: 6px 0;
        line-height: 1.3;
      }
      
      .btn {
        padding: 6px 12px;
        font-size: 0.75rem;
        min-width: 100px;
      }
      
      .btn-row {
        gap: 4px;
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="terminal-box">
    <h1>📡 DNS_PROBE_FINISHED_NXDOMAIN (404)</h1>
    <p>The gateway is unresponsive. Flood the domain lookup with packet queries to wake up the node.</p>

    <!-- Logging buffer panel stream -->
    <div class="log-terminal" id="log-box">
      <div class="log-entry">[SYSTEM] Interface online. Connection state: TIMEOUT.</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="ping-btn" onclick="floodPingQuery()">⚡ FLOOD_PING.EXE</button>
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 RETURN_HOME.EXE</a>
    </div>
  </div>

  <script>
    const logBox = document.getElementById('log-box');
    const pingBtn = document.getElementById('ping-btn');
    const escapeLink = document.getElementById('escape-link');

    let pingCount = 0;
    let isFinished = false;

    // A collection of humorous server irritation logs
    const networkResponses = [
      "PING genshinerebus.github.io: packet loss 100% (gateway unreachable)",
      "PING genshinerebus.github.io: timeout! Request expired on hop 14.",
      "WARN: Server load high. Stop multi-threading requests.",
      "ALERT: Packet flood detected! Security wall warning generated.",
      "CRITICAL: Router thread cache buffer full. Core melting.",
      "FINE! Stop spamming the gateway button. Take the link..."
    ];

    function printLogLine(text, statusClass) {
      const line = document.createElement('div');
      line.className = "log-entry " + (statusClass || "");
      line.innerText = "[" + new Date().toLocaleTimeString() + "] " + text;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function floodPingQuery() {
      if (isFinished) return;

      pingCount++;

      if (pingCount < 8) {
        const responseIdx = Math.min(pingCount - 1, networkResponses.length - 2);
        printLogLine(networkResponses[responseIdx], "log-fail");
      } else {
        isFinished = true;
        pingBtn.classList.add('hidden');
        escapeLink.classList.remove('hidden');

        printLogLine(networkResponses[networkResponses.length - 1], "log-success");
        printLogLine("STATUS_200: Temporary bypass route established successfully.", "log-success");
      }
    }
  </script>

</body>

</html>
