<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Aim Trainer Node Sync</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .container {
      text-align: center;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-text {
      margin-bottom: 8px;
      line-height: 1.35;
      font-size: 0.58rem;
      word-wrap: break-word;
      flex-shrink: 0;
    }

    .score-board {
      font-size: 0.75rem;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .aim-range {
      position: relative;
      width: 100%;
      background-color: #111;
      border: 2px solid #00ff33;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 255, 51, 0.2);
      margin: 8px auto;
      overflow: hidden;
      flex-grow: 1;
      min-height: 200px;
    }

    .aim-target {
      position: absolute;
      background-color: #050505;
      border: 3px solid #00ff33;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff33;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      animation: targetSpawn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      touch-action: manipulation;
    }

    .aim-target::after {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #00ff33;
      border-radius: 50%;
    }

    @keyframes targetSpawn {
      from { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .status-panel {
      font-size: 0.75rem;
      margin: 8px 0;
      min-height: 20px;
      word-wrap: break-word;
      flex-shrink: 0;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
      font-weight: bold;
    }

    .escape-btn {
      border: 2px solid #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 10px #ffcc00;
      text-shadow: 0 0 5px #ffcc00;
    }
    .escape-btn:hover {
      background: #ffcc00;
      color: #050505;
      box-shadow: 0 0 20px #ffcc00;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      body {
        padding: 4px;
      }

      .container {
        padding: 4px;
      }

      .header-text {
        font-size: 0.5rem;
        margin-bottom: 6px;
        line-height: 1.25;
      }

      .score-board {
        font-size: 0.6rem;
        margin-bottom: 6px;
      }

      .aim-range {
        border-width: 1px;
        min-height: 180px;
        margin: 6px auto;
      }

      .aim-target {
        width: 28px;
        height: 28px;
        border-width: 2px;
      }

      .aim-target::after {
        width: 5px;
        height: 5px;
      }

      .status-panel {
        font-size: 0.58rem;
        margin: 6px 0;
        min-height: 18px;
      }

      .btn {
        padding: 6px 12px;
        font-size: 0.62rem;
        margin: 4px;
        min-height: 34px;
      }

      .button-area {
        flex-direction: column;
        gap: 6px;
      }

      .button-area .btn {
        width: 100%;
        margin: 0;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 6px;
      }

      .container {
        padding: 6px;
      }

      .header-text {
        font-size: 0.55rem;
        margin-bottom: 8px;
      }

      .score-board {
        font-size: 0.65rem;
        margin-bottom: 8px;
      }

      .aim-range {
        min-height: 200px;
        margin: 8px auto;
      }

      .aim-target {
        width: 30px;
        height: 30px;
      }

      .status-panel {
        font-size: 0.65rem;
        margin: 8px 0;
      }

      .btn {
        padding: 7px 14px;
        font-size: 0.68rem;
        min-height: 36px;
      }

      .button-area {
        flex-direction: column;
      }

      .button-area .btn {
        width: 100%;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 12px;
      }

      .header-text {
        font-size: 0.7rem;
        margin-bottom: 10px;
      }

      .score-board {
        font-size: 0.85rem;
        margin-bottom: 12px;
      }

      .aim-range {
        border-width: 2px;
        min-height: 260px;
        margin: 10px auto;
      }

      .aim-target {
        width: 34px;
        height: 34px;
      }

      .status-panel {
        font-size: 0.8rem;
        margin: 10px 0;
      }

      .btn {
        padding: 9px 18px;
        font-size: 0.8rem;
        min-height: 40px;
      }

      .button-area {
        flex-direction: row;
        gap: 10px;
      }

      .button-area .btn {
        min-width: 150px;
      }
    }

    /* Desktop (769px+) - DEUTLICH BREITER für bessere Ausnutzung */
    @media (min-width: 769px) {
      body {
        padding: 24px;
      }

      .container {
        padding: 24px;
        width: min(1200px, 95vw);
        max-width: 100%;
      }

      .header-text {
        font-size: clamp(1rem, 2vw, 1.4rem);
        margin-bottom: 16px;
      }

      .score-board {
        font-size: clamp(1.1rem, 1.8vw, 1.5rem);
        margin-bottom: 20px;
      }

      .aim-range {
        border-width: 3px;
        width: min(900px, 92vw);
        height: min(500px, 65vh);
        margin: 16px auto;
      }

      .aim-target {
        width: clamp(35px, 6vw, 55px);
        height: clamp(35px, 6vw, 55px);
        border-width: 4px;
      }

      .aim-target::after {
        width: 8px;
        height: 8px;
      }

      .status-panel {
        font-size: clamp(1rem, 1.5vw, 1.3rem);
        margin: 16px 0;
      }

      .btn {
        padding: 12px 24px;
        font-size: clamp(1rem, 1.5vw, 1.3rem);
        min-height: 48px;
      }

      .button-area {
        flex-direction: row;
        gap: 16px;
      }

      .button-area .btn {
        min-width: 220px;
      }
    }

    /* Large Desktop (1200px+) - NOCH BREITER */
    @media (min-width: 1200px) {
      body {
        padding: 36px;
      }

      .container {
        padding: 36px;
        width: min(1400px, 96vw);
      }

      .header-text {
        font-size: clamp(1.2rem, 1.8vw, 1.6rem);
        margin-bottom: 20px;
      }

      .score-board {
        font-size: clamp(1.3rem, 1.5vw, 1.7rem);
        margin-bottom: 24px;
      }

      .aim-range {
        border-width: 4px;
        width: min(1100px, 90vw);
        height: min(600px, 70vh);
        margin: 20px auto;
      }

      .aim-target {
        width: clamp(40px, 7vw, 65px);
        height: clamp(40px, 7vw, 65px);
        border-width: 5px;
      }

      .aim-target::after {
        width: 10px;
        height: 10px;
      }

      .status-panel {
        font-size: clamp(1.1rem, 1.3vw, 1.4rem);
        margin: 20px 0;
      }

      .btn {
        padding: 14px 28px;
        font-size: clamp(1.1rem, 1.3vw, 1.4rem);
        min-height: 52px;
      }

      .button-area {
        gap: 20px;
      }

      .button-area .btn {
        min-width: 260px;
      }
    }

    /* Extra Large Desktop (1600px+) - Maximale Ausnutzung */
    @media (min-width: 1600px) {
      body {
        padding: 48px;
      }

      .container {
        padding: 48px;
        width: min(1600px, 98vw);
      }

      .header-text {
        font-size: clamp(1.4rem, 1.5vw, 1.8rem);
        margin-bottom: 24px;
      }

      .score-board {
        font-size: clamp(1.5rem, 1.3vw, 1.9rem);
        margin-bottom: 28px;
      }

      .aim-range {
        border-width: 4px;
        width: min(1300px, 92vw);
        height: min(700px, 75vh);
        margin: 24px auto;
      }

      .aim-target {
        width: clamp(45px, 7.5vw, 75px);
        height: clamp(45px, 7.5vw, 75px);
        border-width: 5px;
      }

      .aim-target::after {
        width: 12px;
        height: 12px;
      }

      .status-panel {
        font-size: clamp(1.2rem, 1.2vw, 1.5rem);
        margin: 24px 0;
      }

      .btn {
        padding: 16px 32px;
        font-size: clamp(1.2rem, 1.2vw, 1.5rem);
        min-height: 56px;
      }

      .button-area {
        gap: 24px;
      }

      .button-area .btn {
        min-width: 300px;
      }
    }

    /* Short landscape viewports */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 8px;
      }

      .container {
        padding: 8px;
      }

      .header-text {
        font-size: 0.65rem;
        margin-bottom: 6px;
      }

      .score-board {
        font-size: 0.7rem;
        margin-bottom: 6px;
      }

      .aim-range {
        min-height: 160px;
        margin: 6px auto;
      }

      .aim-target {
        width: 26px;
        height: 26px;
      }

      .status-panel {
        font-size: 0.7rem;
        margin: 6px 0;
      }

      .btn {
        padding: 8px 16px;
        font-size: 0.75rem;
        min-height: 38px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
      .aim-target {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [DESYNC_ALERT] INTERCEPT_LATENCY_ERROR_404</div>
      <div>Mainframe link desynchronized. Click or tap the tracking nodes to align calibration array.</div>
    </div>

    <div class="score-board">
      NODES INTERCEPTED: <span id="hit-count">0</span> / 5
    </div>

    <!-- Tapping playground sandbox field range -->
    <div class="aim-range" id="aim-zone"></div>

    <div class="status-panel" id="terminal-msg">Tracking hardware state: AWAITING_CALIBRATION...</div>

    <div class="button-area">
      <button class="btn hidden" id="reset-btn" onclick="restartWarmupEngine()">REBOOT CORES</button>
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 SYNCED: LAUNCH HOME_GATEWAY.EXE</a>
    </div>
  </div>

  <script>
    const rangeZone = document.getElementById('aim-zone');
    const hitEl = document.getElementById('hit-count');
    const msgEl = document.getElementById('terminal-msg');
    const escapeLink = document.getElementById('escape-link');
    const resetBtn = document.getElementById('reset-btn');

    let hits = 0;
    let isGameOver = false;
    let activeTarget = null;
    let despawnTimeout;

    function startWarmupEngine() {
      hits = 0;
      isGameOver = false;
      activeTarget = null;
      
      hitEl.innerText = hits;
      msgEl.innerText = "Tracking sensor array active. Calibrating targeting grids...";
      
      escapeLink.classList.add('hidden');
      resetBtn.classList.add('hidden');
      rangeZone.innerHTML = '';

      spawnNewTrackingTarget();
    }

    function spawnNewTrackingTarget() {
      if (isGameOver) return;

      if (activeTarget) activeTarget.remove();

      const el = document.createElement('div');
      el.className = 'aim-target';

      const maxWidth = rangeZone.clientWidth;
      const maxHeight = rangeZone.clientHeight;
      
      const xPos = Math.floor(Math.random() * (maxWidth - 60)) + 30;
      const yPos = Math.floor(Math.random() * (maxHeight - 60)) + 30;

      el.style.left = xPos + 'px';
      el.style.top = yPos + 'px';

      el.addEventListener('mousedown', registerTargetHit);
      el.addEventListener('touchstart', function(e) {
        e.preventDefault();
        registerTargetHit();
      }, { passive: false });

      rangeZone.appendChild(el);
      activeTarget = el;

      const despawnDelay = Math.max(700, 1600 - (hits * 150));
      despawnTimeout = setTimeout(handleTargetDespawn, despawnDelay);
    }

    function registerTargetHit() {
      if (isGameOver) return;

      clearTimeout(despawnTimeout);
      hits++;
      hitEl.innerText = hits;

      if (hits >= 5) {
        triggerWinState();
      } else {
        msgEl.innerText = "Log: Node lock captured. Sequence index moving...";
        spawnNewTrackingTarget();
      }
    }

    function handleTargetDespawn() {
      if (isGameOver) return;
      triggerCoresCrash();
    }

    function triggerCoresCrash() {
      isGameOver = true;
      clearTimeout(despawnTimeout);
      if (activeTarget) {
        activeTarget.style.borderColor = '#ff3333';
        activeTarget = null;
      }
      resetBtn.classList.remove('hidden');
      msgEl.innerHTML = "<span style='color: #ff3333;'>CALIBRATION_FAILED: Target tracking lost. Synchronization dropped.</span>";
    }

    function triggerWinState() {
      isGameOver = true;
      clearTimeout(despawnTimeout);
      if (activeTarget) activeTarget.remove();
      
      escapeLink.classList.remove('hidden');
      msgEl.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>CALIBRATION_COMPLETE: Index aligned perfectly! Core stable.</span>";
    }

    function restartWarmupEngine() {
      startWarmupEngine();
    }

    startWarmupEngine();
  </script>
</body>
</html>
