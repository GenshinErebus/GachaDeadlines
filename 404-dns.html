<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - DNS Connection Error</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-dns.css">
</head>

<body>

  <div class="terminal-box">
    <h1>📡 DNS_PROBE_FINISHED_NXDOMAIN (404)</h1>
    <p>The gateway is unresponsive. Flood the domain lookup with packet queries to wake up the node.</p>

    <!-- Logging buffer panel stream -->
    <div class="log-terminal" id="log-box">
      <div class="log-entry">[SYSTEM] Interface online. Connection state: TIMEOUT.</div>
    </div>

    <div class="btn-row">
      <button class="btn" id="ping-btn" onclick="floodPingQuery()">⚡ FLOOD_PING.EXE</button>
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 RETURN_HOME.EXE</a>
    </div>
  </div>

  <!-- Script -->
  <script src="404-dns.js"></script>

</body>

</html>
