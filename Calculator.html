<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Deadline Converter (Europe Base)</title>
    <link rel="stylesheet" href="Cstyle.css">
</head>

<body>
    <div class="container">
        <h2>Deadline Converter</h2>

        <label for="gameLogic">Select a Game:</label>
        <select id="gameLogic">
            <option value="" disabled selected>-- Select a Game --</option>
            <option value="3">✨ Genshin Impact</option>
            <option value="3">🚂 Honkai Star Rail</option>
            <option value="3">📟 Zenless Zone Zero</option>
            <option value="3">🏗️ Arknights Endfield</option>
            <option value="21">🌗 Duet Night Abyss</option>
            <option value="4">🏙️ Neverness To Everness</option>
            <option value="10">⏳ Reverse 1999</option>
            <option value="3">🌊 Wuthering Waves</option>
        </select>

        <label for="remainingTime">Remaining Time:</label>
        <input type="text" id="remainingTime" placeholder="e.g., 6d 14h, 30d, 12h">

        <label class="checkbox-label">
            <input type="checkbox" id="winterTimeOffset">
            Apply winter time
        </label>

        <button onclick="calculateDeadline()">Generate & Copy Code</button>

        <div class="output-box" id="output">Code will appear here...</div>
        <a href="index.html" class="back-link">← Back to Main Page</a>
    </div>

<script src="Cscript.js"></script>

</body>

</html>
