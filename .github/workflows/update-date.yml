name: Auto Update Timestamp & Cache Bust

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: true

      - name: Set variables
        id: vars
        run: |
          SHORT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          echo "SHORT_HASH=$SHORT_HASH" >> $GITHUB_ENV
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV

      - name: Update assets and HTML
        run: |
          # Create versioned assets
          cp style.css "style.${SHORT_HASH}.css"
          cp script.js "script.${SHORT_HASH}.js"
          
          # Update index.html with perl (robust escaping)
          perl -i -pe '
            s|<!-- STYLE_VERSION --><link rel="stylesheet" href="style\.css\?v=[^"]*"><!-- END_STYLE -->|
              <!-- STYLE_VERSION --><link rel="stylesheet" href="style.'"${SHORT_HASH}".css"><!-- END_STYLE -->|x;
            s|<!-- SCRIPT_VERSION --><script src="script\.js\?v=[^"]*"></script><!-- END_SCRIPT -->|
              <!-- SCRIPT_VERSION --><script src="script.'"${SHORT_HASH}".js"></script><!-- END_SCRIPT -->|x;
            s|(<!-- LAST_UPDATE_HERE -->).*?(<!-- END_UPDATE -->)|
              ${1}'"${CURRENT_DATE}"'${2}|x;
          ' index.html

      - name: Commit and push
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "style.${SHORT_HASH}.css" "script.${SHORT_HASH}.js"
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: cache bust [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes detected"
          fi
