name: Auto Update Timestamp

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Short Hash
        id: vars
        run: |
          echo "CURRENT_DATE=Updated $(date -u '+%d %B %Y')" >> $GITHUB_ENV
          echo "SHORT_HASH=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_ENV

      - name: Replace Placeholders in HTML
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->"
          replace: "<!-- LAST_UPDATE_HERE -->${{ env.CURRENT_DATE }}<!-- END_UPDATE -->"
          include: "index.html"
          regex: true

      - name: Replace Script Version
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "<!-- SCRIPT_VERSION -->.*<!-- END_SCRIPT -->"
          replace: "<!-- SCRIPT_VERSION --><script src=\"script.js?v=${{ env.SHORT_HASH }}\"></script><!-- END_SCRIPT -->"
          include: "index.html"
          regex: true

      - name: Replace Style Version
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "<!-- STYLE_VERSION -->.*<!-- END_STYLE -->"
          replace: "<!-- STYLE_VERSION --><link rel=\"stylesheet\" href=\"style.css?v=${{ env.SHORT_HASH }}\"><!-- END_STYLE -->"
          include: "index.html"
          regex: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
