name: Auto Update Timestamp

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: false

      - name: Insert current date and update cache versions
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          
          sed -i "s|.*LAST_UPDATE_HERE.*|<p id=\"update-status\"><!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE --></p>|g" index.html
          sed -i "s|.*SCRIPT_VERSION.*|<!-- SCRIPT_VERSION --><script src=\"script.js?v=${COMMIT_HASH}\"></script><!-- END_SCRIPT -->|g" index.html
          sed -i "s|.*STYLE_VERSION.*|<!-- STYLE_VERSION --><link rel=\"stylesheet\" href=\"style.css?v=${COMMIT_HASH}\"><!-- END_STYLE -->|g" index.html

      - name: Commit and push changes natively
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add index.html
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update timestamp and cache versions [skip ci]"
            git push https://x-access-token:${{ secrets.BYPASS_TOKEN }}@://github.com{{ github.repository }}.git HEAD:main
          else
            echo "No changes detected in index.html"
          fi
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_TOKEN }}
