name: Auto Update Timestamp

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: true

      - name: Insert current date and update cache versions
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          COMMIT_HASH="${{ github.sha }}"
          SHORT_HASH=${COMMIT_HASH:0:7}
          
          sed -i "s|.*LAST_UPDATE_HERE.*|<p id=\"update-status\"><!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE --></p>|g" index.html
          sed -i "s|.*SCRIPT_VERSION.*|<!-- SCRIPT_VERSION --><script src=\"script.js?v=${SHORT_HASH}\"></script><!-- END_SCRIPT -->|g" index.html
          sed -i "s|.*STYLE_VERSION.*|<!-- STYLE_VERSION --><link rel=\"stylesheet\" href=\"style.css?v=${SHORT_HASH}\"><!-- END_STYLE -->|g" index.html

      - name: Commit and push changes natively
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_TOKEN }}
          REPO_PATH: ${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add index.html
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "pushing timestamp updates [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes detected in index.html"
          fi

