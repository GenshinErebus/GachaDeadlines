name: Auto Update Timestamp & Cache Bust

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: true

      - name: Set unique version timestamp
        run: |
          VERSION=$(date +%s)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          echo "CURRENT_DATE=$CURRENT_DATE" >> $GITHUB_ENV

      - name: Create versioned assets
        run: |
          cp style.css "style.${VERSION}.css"
          cp script.js "script.${VERSION}.js"

      - name: Update index.html
        run: |
          sed -i "s/style\.css?v=[0-9]*/style.${VERSION}.css/" index.html
          sed -i "s/script\.js?v=[0-9]*/script.${VERSION}.js/" index.html
          sed -i "s/<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->/<!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE -->/" index.html

      - name: Commit and push
        env:
          BYPASS_TOKEN: ${{ secrets.BYPASS_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "style.${VERSION}.css" "script.${VERSION}.js"
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: cache bust [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes detected"
          fi
