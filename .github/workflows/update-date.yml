name: Auto Update Timestamp

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Insert current date
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          
          # 1. Update the timestamp between HTML comments (Your original logic)
          sed -i "s|<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->|<!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE -->|g" index.html
          
          # 2. Update cache versions safely using the calculated commit hash
          sed -i "s|script\.js?v=[^\"]*|script.js?v=${COMMIT_HASH}|g" index.html
          sed -i "s|style\.css?v=[^\"]*|style.css?v=${COMMIT_HASH}|g" index.html

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update timestamp in index.html"
          file_pattern: 'index.html sitemap.xml .nojekyll'
          commit_options: '--allow-empty'
