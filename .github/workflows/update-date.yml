name: Auto Update Timestamp

on:
  push:
    paths:
      - 'script.js'
      - 'style.css'

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BYPASS_TOKEN }}
          persist-credentials: true

      - name: Update timestamp and cache busting hashes
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          SHORT_HASH="${{ github.sha }}"
          SHORT_HASH=${SHORT_HASH:0:7}
          
          sed -i "s|<p id=\"update-status\">.*|<p id=\"update-status\"><!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE --></p>|g" index.html
          
          sed -i "s|style\.css\?v=[^\"]*|style.css?v=${SHORT_HASH}|g" index.html
          sed -i "s|script\.js\?v=[^\"]*|script.js?v=${SHORT_HASH}|g" index.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add index.html
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update: timestamp and version bump [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes detected in index.html"
          fi
