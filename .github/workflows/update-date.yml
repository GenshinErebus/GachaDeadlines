name: Auto Update Timestamp

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update HTML contents and write files
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          SHORT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Das Datum im Kommentar-Block ersetzen
          sed -i "s|<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->|<!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE -->|g" index.html
          
          # Die Versionen direkt über den Dateinamen anspringen (sucht nach style.css?v=... oder script.js?v=...)
          sed -i "s|style.css?v=[^\"']*|style.css?v=${SHORT_HASH}|g" index.html
          sed -i "s|script.js?v=[^\"']*|script.js?v=${SHORT_HASH}|g" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
