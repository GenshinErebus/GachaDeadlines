name: Auto Update Timestamp

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Insert current date and update cache versions
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          COMMIT_HASH=$(git rev-parse --short=7 HEAD)
          
          python3 -c "
          import re
          
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = re.sub(r'<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->', f'<!-- LAST_UPDATE_HERE -->{CURRENT_DATE}<!-- END_UPDATE -->', content)
          content = re.sub(r'<!-- SCRIPT_VERSION -->[\s\S]*?<!-- END_SCRIPT -->', f'<!-- SCRIPT_VERSION -->\n<script src=\'script.js?v={COMMIT_HASH}\'></script>\n<!-- END_SCRIPT -->', content)
          content = re.sub(r'<!-- STYLE_VERSION -->[\s\S]*?<!-- END_STYLE -->', f'<!-- STYLE_VERSION -->\n<link rel=\'stylesheet\' href=\'style.css?v={COMMIT_HASH}\'>\n<!-- END_STYLE -->', content)
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update timestamp in index.html"
          file_pattern: 'index.html|sitemap.xml|.nojekyll'
          commit_options: '--allow-empty'
