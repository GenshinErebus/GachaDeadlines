name: Auto Update Timestamp & Cache Version

permissions:
  contents: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Commit Hash
        id: hash
        run: echo "commit_hash=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Update timestamp and cache versions
        run: |
          CURRENT_DATE="Updated $(date -u '+%d %B %Y')"
          
          # Replace content between comments even if there is nothing between them
          sed -i "s|<!-- LAST_UPDATE_HERE -->.*<!-- END_UPDATE -->|<!-- LAST_UPDATE_HERE -->${CURRENT_DATE}<!-- END_UPDATE -->|g" index.html || true
          
          # Update cache versions for scripts and styles
          sed -i "s|script\.js?v=[^\"]*|script.js?v=${{ steps.hash.outputs.commit_hash }}|g" index.html || true
          sed -i "s|style\.css?v=[^\"]*|style.css?v=${{ steps.hash.outputs.commit_hash }}|g" index.html || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update timestamp & cache version (${{ steps.hash.outputs.commit_hash }})"
          file_pattern: 'index.html sitemap.xml'
          commit_options: '--allow-empty' # Allows Git to proceed even if no files were changed
