name: Auto Update Timestamp

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    paths:
      - 'script.js'

jobs:
  update-html:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update HTML via Node Script
        run: |
          node -e '
          const fs = require("fs");
          let html = fs.readFileSync("index.html", "utf8");
          
          const currentDate = "Updated " + new Date().toUTCString().split(" ").slice(1, 4).join(" ");
          const shortHash = "${{ github.sha }}".substring(0, 7);
          
          html = html.replace(/<p id="update-status">[\s\S]*?<\/p>/, `<p id="update-status"><!-- LAST_UPDATE_HERE -->\${currentDate}<!-- END_UPDATE --></p>`);
          html = html.replace(/src="script\.js\?v=[^"]*"/, `src="script.js?v=\${shortHash}"`);
          html = html.replace(/href="style\.css\?v=[^"]*"/, `href="style.css?v=\${shortHash}"`);
          
          fs.writeFileSync("index.html", html, "utf8");
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
