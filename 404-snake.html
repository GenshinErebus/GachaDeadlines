<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Memory Overload (Snake)</title>
  <style>
    /* Retro Terminal Look - Fully Responsive */
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .container {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 8px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header-text {
      margin-bottom: 8px;
      line-height: 1.3;
      font-size: 0.65rem;
      text-align: center;
      flex-shrink: 0;
      word-wrap: break-word;
    }

    .score-board {
      font-size: 0.7rem;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Game Canvas - Responsive scaling */
    canvas {
      background-color: #111;
      border: 2px solid #00ff33;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(0, 255, 51, 0.25);
      display: block;
      margin: 8px auto;
      max-width: 100%;
      height: auto;
      flex-grow: 1;
      min-height: 150px;
    }

    .button-area {
      margin-top: 8px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Action Buttons */
    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      white-space: nowrap;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      body {
        padding: 4px;
      }

      .container {
        padding: 6px;
      }

      .header-text {
        font-size: 0.55rem;
        margin-bottom: 6px;
        line-height: 1.2;
      }

      .score-board {
        font-size: 0.6rem;
        margin-bottom: 6px;
      }

      canvas {
        border-width: 1px;
        min-height: 120px;
        margin: 6px auto;
      }

      .btn {
        padding: 6px 12px;
        font-size: 0.62rem;
        min-height: 34px;
      }

      .button-area {
        flex-direction: column;
        gap: 6px;
      }

      .button-area .btn {
        width: 100%;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 6px;
      }

      .container {
        padding: 8px;
      }

      .header-text {
        font-size: 0.6rem;
        margin-bottom: 8px;
      }

      .score-board {
        font-size: 0.65rem;
        margin-bottom: 8px;
      }

      canvas {
        min-height: 140px;
        margin: 8px auto;
      }

      .btn {
        padding: 7px 14px;
        font-size: 0.68rem;
        min-height: 36px;
      }

      .button-area {
        flex-direction: column;
      }

      .button-area .btn {
        width: 100%;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 12px;
      }

      .header-text {
        font-size: 0.75rem;
        margin-bottom: 10px;
        line-height: 1.35;
      }

      .score-board {
        font-size: 0.8rem;
        margin-bottom: 10px;
      }

      canvas {
        border-width: 2px;
        min-height: 200px;
        margin: 10px auto;
      }

      .btn {
        padding: 9px 18px;
        font-size: 0.8rem;
        min-height: 40px;
      }

      .button-area {
        flex-direction: row;
      }

      .button-area .btn {
        min-width: 160px;
      }
    }

    /* Desktop (769px+) - Optimale Platzausnutzung */
    @media (min-width: 769px) {
      body {
        padding: 16px;
      }

      .container {
        padding: 16px;
      }

      .header-text {
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .score-board {
        font-size: clamp(0.85rem, 1.5vw, 1rem);
        margin-bottom: 12px;
      }

      canvas {
        border-width: 3px;
        min-height: 280px;
        margin: 12px auto;
        max-width: min(500px, 90vw);
      }

      .btn {
        padding: 10px 20px;
        font-size: clamp(0.85rem, 1.5vw, 1rem);
        min-height: 44px;
      }

      .button-area {
        flex-direction: row;
        gap: 12px;
      }

      .button-area .btn {
        min-width: 180px;
      }
    }

    /* Large Desktop (1200px+) - Maximale Readability */
    @media (min-width: 1200px) {
      body {
        padding: 24px;
      }

      .container {
        padding: 24px;
      }

      .header-text {
        font-size: clamp(0.9rem, 1.3vw, 1.2rem);
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .score-board {
        font-size: clamp(0.95rem, 1.3vw, 1.1rem);
        margin-bottom: 16px;
      }

      canvas {
        min-height: 350px;
        margin: 16px auto;
        max-width: min(600px, 85vw);
      }

      .btn {
        padding: 12px 24px;
        font-size: clamp(0.95rem, 1.2vw, 1.15rem);
        min-height: 48px;
      }

      .button-area {
        flex-direction: row;
        gap: 16px;
      }

      .button-area .btn {
        min-width: 200px;
      }
    }

    /* Short landscape viewports */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 8px;
      }

      .container {
        padding: 8px;
      }

      .header-text {
        font-size: 0.65rem;
        margin-bottom: 6px;
      }

      .score-board {
        font-size: 0.7rem;
        margin-bottom: 6px;
      }

      canvas {
        min-height: 160px;
        margin: 6px auto;
      }

      .btn {
        padding: 8px 16px;
        font-size: 0.75rem;
        min-height: 38px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [CRITICAL] 404_SECTOR_LOST</div>
      <div>Collect memory leaks to repair the core data index. Avoid the firewall borders!</div>
      <div>Controls: Swipe (Mobile) or use <span style="color: #ffffff;">ARROW KEYS / WASD</span> (Desktop)</div>
    </div>

    <div class="score-board">
      DATA INDEXED: <span id="current-score">0</span> / 10
    </div>

    <!-- The Snake Matrix Canvas -->
    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <div class="button-area">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT SYSTEM</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('current-score');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Grid sizing configs
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // Game states
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize; // horizontal speed (starting moving right)
    let dy = 0;        // vertical speed
    let score = 0;
    let isGameOver = false;
    let gameInterval;
    const gameSpeed = 100; // lower number = faster game (ms per frame)

    // --- SWIPE GESTURE DETECTION (SMARTPHONE) ---
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (isGameOver) return;
      e.preventDefault(); // Lock mobile screen bouncing while steering
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      if (isGameOver) return;
      
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      
      // Check if user swiped far enough to trigger a turn (threshold of 30px)
      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 30) {
          // Horizontal Swipes
          if (diffX > 0 && dx === 0) { dx = gridSize; dy = 0; }      // Swipe Right
          else if (diffX < 0 && dx === 0) { dx = -gridSize; dy = 0; } // Swipe Left
        }
      } else {
        if (Math.abs(diffY) > 30) {
          // Vertical Swipes
          if (diffY > 0 && dy === 0) { dx = 0; dy = gridSize; }      // Swipe Down
          else if (diffY < 0 && dy === 0) { dx = 0; dy = -gridSize; } // Swipe Up
        }
      }
    });

    // --- KEYBOARD CONTROLS (DESKTOP) ---
    document.addEventListener('keydown', (e) => {
      if (isGameOver) return;
      
      const key = e.key.toLowerCase();
      
      if ((key === 'arrowup' || key === 'w') && dy === 0) { dx = 0; dy = -gridSize; e.preventDefault(); }
      if ((key === 'arrowdown' || key === 's') && dy === 0) { dx = 0; dy = gridSize; e.preventDefault(); }
      if ((key === 'arrowleft' || key === 'a') && dx === 0) { dx = -gridSize; dy = 0; e.preventDefault(); }
      if ((key === 'arrowright' || key === 'd') && dx === 0) { dx = gridSize; dy = 0; e.preventDefault(); }
    });

    // --- ENGINE LOGIC ---

    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;
      
      // Make sure food doesn't spawn inside the snake's body
      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) generateFood();
      });
    }

    function update() {
      if (isGameOver) return;

      // 1. Move the head forward
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // 2. Check food collision (Eating mechanism)
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.innerText = score;
        generateFood();
        
        // Unlock escape button if player manages a 10-score sequence
        if (score >= 10) {
          escapeBtn.classList.remove('hidden');
        }
      } else {
        // Remove the tail if no food eaten (keeps moving instead of growing)
        snake.pop();
      }

      // 3. Wall / Border collisions check
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        triggerLoss();
      }

      // 4. Self-destruction body collision check
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          triggerLoss();
        }
      }
    }

    function draw() {
      // Clear board
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff33';

      // Draw Snake segments
      snake.forEach((part, index) => {
        // Bright green head, slightly dimmer tail links
        ctx.fillStyle = index === 0 ? '#00ff33' : '#0c2c0e';
        ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
      });

      // Draw Food Node as a little hacker '01' text or square block
      ctx.fillStyle = '#ff3333';
      ctx.shadowColor = '#ff3333';
      ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);

      // Overlay Error state screen text
      if (isGameOver) {
        ctx.fillStyle = '#ff3333';
        ctx.shadowColor = '#ff3333';
        ctx.font = '20px "Courier New"';
        ctx.textAlign = 'center';
        ctx.fillText('⚡ SEGMENTATION_FAULT ⚡', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '14px "Courier New"';
        ctx.fillText('Click Reboot System to re-index', canvas.width / 2, canvas.height / 2 + 15);
      }

      ctx.shadowBlur = 0; // Performance sweep cleanup
    }

    function triggerLoss() {
      isGameOver = true;
      clearInterval(gameInterval);
      resetBtn.classList.remove('hidden');
    }

    function resetGame() {
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      dx = gridSize;
      dy = 0;
      resetBtn.classList.add('hidden');
      
      // Initialize snake in the center of the grid (3 segments long)
      snake = [
        { x: gridSize * 5, y: gridSize * 10 },
        { x: gridSize * 4, y: gridSize * 10 },
        { x: gridSize * 3, y: gridSize * 10 }
      ];
      
      generateFood();
      clearInterval(gameInterval);
      gameInterval = setInterval(() => { update(); draw(); }, gameSpeed);
    }

    // Launch engine mechanics
    resetGame();
  </script>

</body>
</html>
