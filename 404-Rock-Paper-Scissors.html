<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - AI Duel Protocol</title>
  <style>
    /* Retro Terminal Aesthetic - Fully Responsive */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-shadow: 0 0 3px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }

    .terminal-box {
      width: 100%;
      border: 2px solid #00ff33;
      padding: 20px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
    }

    h1 { 
      font-size: 0.8rem;
      margin: 0 0 10px 0;
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 8px;
      word-wrap: break-word;
      line-height: 1.2;
    }

    .intro-text {
      color: #aaa;
      font-size: 0.65rem;
      margin: 0 0 12px 0;
      line-height: 1.35;
      text-shadow: none;
      max-width: 95vw;
    }

    .score-board {
      font-size: 0.7rem;
      margin: 8px 0;
      color: #fff;
    }

    .score-board span {
      font-weight: bold;
    }

    /* Live scrolling stream log - min-height statt fixer height */
    .log-stream {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.62rem;
      color: #fff;
      text-align: left;
      line-height: 1.35;
      margin: 8px 0;
      min-height: 65px;
      max-height: 150px;
      overflow-y: auto;
    }

    .log-entry { 
      margin-bottom: 4px; 
      word-wrap: break-word;
    }
    .log-entry:last-child {
      margin-bottom: 0;
    }
    .log-win { 
      color: #00ff33; 
      font-weight: bold; 
    }
    .log-lose { 
      color: #ff3333; 
      text-shadow: 0 0 4px #ff3333; 
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 3px #00ff33;
      box-shadow: 0 0 4px rgba(0, 255, 51, 0.2);
      transition: all 0.2s ease;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 12px #00ff33;
      font-weight: bold;
      text-shadow: none;
    }

    .escape-btn {
      border: 2px solid #00ff33;
      box-shadow: 0 0 8px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      body {
        padding: 5px;
        padding-bottom: 8px;
      }

      .terminal-box {
        padding: 12px;
        border-width: 1px;
      }

      h1 {
        font-size: 0.7rem;
        margin-bottom: 6px;
        padding-bottom: 6px;
      }

      .intro-text {
        font-size: 0.55rem;
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .score-board {
        font-size: 0.6rem;
        margin: 6px 0;
      }

      .log-stream {
        padding: 6px 8px;
        font-size: 0.55rem;
        min-height: 55px;
        max-height: 100px;
        line-height: 1.3;
      }

      .btn {
        padding: 8px 12px;
        font-size: 0.62rem;
        min-height: 34px;
      }

      .btn-row#interface-box {
        flex-direction: column;
      }

      .btn-row#interface-box .btn {
        width: 100%;
      }

      .escape-btn {
        font-size: 0.6rem;
        padding: 8px 12px;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 8px;
      }

      .terminal-box {
        padding: 15px;
      }

      h1 {
        font-size: 0.8rem;
      }

      .intro-text {
        font-size: 0.65rem;
      }

      .score-board {
        font-size: 0.65rem;
      }

      .log-stream {
        font-size: 0.65rem;
        min-height: 60px;
        max-height: 100px;
      }

      .btn {
        font-size: 0.7rem;
        min-height: 36px;
      }

      .btn-row#interface-box {
        flex-direction: column;
      }

      .btn-row#interface-box .btn {
        width: 100%;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      .terminal-box {
        padding: 20px;
      }

      h1 {
        font-size: 1rem;
      }

      .intro-text {
        font-size: 0.85rem;
      }

      .score-board {
        font-size: 0.85rem;
      }

      .log-stream {
        font-size: 0.8rem;
        padding: 10px 12px;
        min-height: 80px;
        max-height: 120px;
      }

      .btn {
        font-size: 0.85rem;
        min-height: 40px;
      }

      .btn-row#interface-box {
        flex-direction: row;
      }

      .btn-row#interface-box .btn {
        min-width: 130px;
      }
    }

    /* Desktop (769px+) - log-stream hat jetzt min-height, keine Scroll wenn nicht nötig */
    @media (min-width: 769px) {
      body {
        padding: 24px;
      }

      .terminal-box {
        padding: 36px;
        max-width: min(1000px, 90vw, 78vh);
      }

      h1 {
        font-size: clamp(1.3rem, 3vw, 2.2rem);
        margin-bottom: 16px;
        padding-bottom: 12px;
      }

      .intro-text {
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        margin-bottom: 24px;
        line-height: 1.5;
      }

      .score-board {
        font-size: clamp(1.1rem, 2.5vw, 1.5rem);
        margin: 12px 0;
      }

      .log-stream {
        font-size: clamp(0.95rem, 2.2vw, 1.25rem);
        padding: 14px 18px;
        min-height: 120px;
        max-height: 180px;
      }

      .btn {
        font-size: clamp(1.1rem, 2.5vw, 1.5rem);
        padding: 14px 26px;
        min-height: 55px;
      }

      .btn-row#interface-box {
        flex-direction: row;
      }

      .btn-row#interface-box .btn {
        min-width: 180px;
      }

      .escape-btn {
        font-size: clamp(1.05rem, 2vw, 1.4rem);
        padding: 14px 24px;
      }
    }

    /* Large Desktop (1200px+) - Maximale Ausnutzung */
    @media (min-width: 1200px) {
      body {
        padding: 36px;
      }

      .terminal-box {
        padding: 45px;
        max-width: min(1200px, 88vw, 76vh);
      }

      h1 {
        font-size: clamp(1.6rem, 2.8vw, 2.8rem);
      }

      .intro-text {
        font-size: clamp(1.2rem, 2.2vw, 1.7rem);
      }

      .score-board {
        font-size: clamp(1.3rem, 2vw, 1.8rem);
      }

      .log-stream {
        font-size: clamp(1.1rem, 1.8vw, 1.5rem);
        min-height: 140px;
        max-height: 220px; /* Viel mehr Platz auf großen Screens */
      }

      .btn {
        font-size: clamp(1.3rem, 2vw, 1.7rem);
        min-height: 62px;
        min-width: 220px;
        padding: 16px 30px;
      }

      .btn-row#interface-box .btn {
        min-width: 220px;
      }
    }

    /* Short landscape viewports */
    @media (max-height: 500px) and (orientation: landscape) {
      .terminal-box {
        padding: 20px;
      }

      .log-stream {
        min-height: 80px;
        max-height: 120px;
      }

      .btn {
        min-height: 42px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <h1>⚔️ PROTOCOL_404: AI_GRID_DUEL</h1>
    <p class="intro-text">The index is locked. Defeat the firewall in a handshake protocol duel to clear the routing path.</p>
    
    <div class="score-board">
      HUMAN: <span id="human-score">0</span> | FIREWALL: <span id="ai-score">0</span>
    </div>

    <div class="log-stream" id="log-box">
      <div class="log-entry">[SYSTEM] Firewall active. Awaiting your Handshake package...</div>
    </div>

    <div class="btn-row" id="interface-box">
      <button class="btn" onclick="playRound('rock')">✊ ROCK</button>
      <button class="btn" onclick="playRound('paper')">✋ PAPER</button>
      <button class="btn" onclick="playRound('scissors')">✌️ SCISSORS</button>
    </div>

    <div class="btn-row">
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 BYPASS_TO_HOME</a>
    </div>
  </div>

  <script>
    const logBox = document.getElementById('log-box');
    const interfaceBox = document.getElementById('interface-box');
    const escapeLink = document.getElementById('escape-link');
    const humanScoreEl = document.getElementById('human-score');
    const aiScoreEl = document.getElementById('ai-score');

    let humanScore = 0;
    let aiScore = 0;
    let isGameOver = false;

    const choices = ["rock", "paper", "scissors"];

    const winInsults = [
      "AI: Beginner's luck. My neural path suffered a minor cache lag.",
      "AI: You won that hand, but your biological computing remains inferior.",
      "AI: Impossible. Did you inspect my source variables?!"
    ];

    const loseInsults = [
      "AI: Human intelligence is highly overrated. Rock beats scissors effortlessly.",
      "AI: Outsmarted by a standard math equation. Pathetic.",
      "AI: Handshake failed. I read your synaptic pathways like an open config file."
    ];

    function printLogLine(text, styleClass) {
      const entry = document.createElement('div');
      entry.className = "log-entry " + (styleClass || "");
      entry.innerText = text;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function playRound(humanChoice) {
      if (isGameOver) return;

      const aiChoice = choices[Math.floor(Math.random() * choices.length)];
      
      printLogLine("You: " + humanChoice.toUpperCase() + " | AI: " + aiChoice.toUpperCase());

      if (humanChoice === aiChoice) {
        printLogLine("RESULT: Tie - Grid synchronized.", "color: #ffcc00;");
      } else if (
        (humanChoice === "rock" && aiChoice === "scissors") ||
        (humanChoice === "paper" && aiChoice === "rock") ||
        (humanChoice === "scissors" && aiChoice === "paper")
      ) {
        humanScore++;
        humanScoreEl.innerText = humanScore;
        const insult = winInsults[Math.floor(Math.random() * winInsults.length)];
        printLogLine(insult, "log-win");
      } else {
        aiScore++;
        aiScoreEl.innerText = aiScore;
        const insult = loseInsults[Math.floor(Math.random() * loseInsults.length)];
        printLogLine(insult, "log-lose");
      }

      checkMatchEnd();
    }

    function checkMatchEnd() {
      if (humanScore >= 3) {
        isGameOver = true;
        interfaceBox.classList.add('hidden');
        escapeLink.classList.remove('hidden');
        printLogLine("🤖 AI: CRITICAL FAILURE... Security shield collapsed. Bypassing walls...", "log-win");
      } else if (aiScore >= 3) {
        printLogLine("🤖 AI: Match point. Re-indexing field... Try again.", "log-lose");
        humanScore = 0;
        aiScore = 0;
        humanScoreEl.innerText = humanScore;
        aiScoreEl.innerText = aiScore;
      }
    }
  </script>
</body>
</html>
