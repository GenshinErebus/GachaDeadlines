<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sector Disrupted</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-ttt.css">
</head>

  <div class="container">

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>

      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>

      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="status" id="status">Your turn, User (X)...</div>

    <div class="button-group">
      <button class="btn" id="reset-btn">Reset Grid</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>

  <!-- Script -->
  <script src="404-ttt.js"></script>
