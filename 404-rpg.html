<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Quest Board</title>
  <style>
    /* Retro Terminal Look - Fully Responsive */
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }

    .quest-box {
      width: 100%;
      border: 2px dashed #00ff33;
      padding: 25px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    h1 { 
      font-size: 1.8rem; 
      margin-top: 0; 
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 10px;
      color: #ffffff;
      flex-shrink: 0;
      word-wrap: break-word;
    }

    /* Adventure story dialogue line display - responsive sizing */
    .story-display {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 20px;
      border-radius: 4px;
      font-size: 1.05rem;
      color: #ffffff;
      line-height: 1.5;
      margin: 20px 0;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      overflow-y: auto;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn {
      background: transparent;
      border: 1px solid #00ff33;
      color: #00ff33;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      transition: all 0.2s ease;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .btn-escape {
      border: 2px solid #ffcc00;
      color: #ffcc00;
      box-shadow: 0 0 8px #ffcc00;
    }
    .btn-escape:hover {
      background: #ffcc00;
      color: #050505;
      box-shadow: 0 0 20px #ffcc00;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (< 360px or height < 500px) */
    @media (max-width: 359px) or (max-height: 499px) {
      body {
        padding: 5px;
        padding-bottom: 8px;
      }

      .quest-box {
        padding: 12px;
        border-width: 1px;
      }

      h1 {
        font-size: 0.85rem;
        padding-bottom: 6px;
        margin-bottom: 8px;
      }

      .quest-box p {
        font-size: 0.6rem;
        margin-bottom: 10px;
        line-height: 1.25;
      }

      .story-display {
        font-size: 0.65rem;
        padding: 10px 12px;
        min-height: 100px;
        margin: 10px 0;
        line-height: 1.35;
      }

      .btn {
        padding: 8px 16px;
        font-size: 0.7rem;
        min-height: 38px;
      }

      .btn-row#choices-panel {
        flex-direction: column;
      }

      .btn-row#choices-panel .btn {
        width: 100%;
      }

      .btn-escape {
        font-size: 0.75rem;
        padding: 10px 20px;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 8px;
      }

      .quest-box {
        padding: 18px;
      }

      h1 {
        font-size: 1.1rem;
        padding-bottom: 8px;
      }

      .quest-box p {
        font-size: 0.7rem;
        margin-bottom: 12px;
      }

      .story-display {
        font-size: 0.8rem;
        padding: 14px 16px;
        min-height: 110px;
        margin: 12px 0;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.85rem;
        min-height: 42px;
      }

      .btn-row#choices-panel {
        flex-direction: column;
      }

      .btn-row#choices-panel .btn {
        width: 100%;
      }

      .btn-escape {
        font-size: 0.9rem;
        padding: 12px 22px;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      .quest-box {
        padding: 22px;
        max-width: min(600px, 95vw);
      }

      h1 {
        font-size: 1.4rem;
        padding-bottom: 10px;
      }

      .quest-box p {
        font-size: 0.85rem;
        margin-bottom: 16px;
      }

      .story-display {
        font-size: 0.95rem;
        padding: 18px 20px;
        min-height: 130px;
        margin: 16px 0;
      }

      .btn {
        padding: 12px 22px;
        font-size: 0.95rem;
        min-height: 44px;
      }

      .btn-row#choices-panel {
        flex-direction: row;
      }

      .btn-row#choices-panel .btn {
        min-width: 180px;
      }
    }

    /* Desktop (769px+) - Optimale Platzausnutzung */
    @media (min-width: 769px) {
      body {
        padding: 24px;
      }

      .quest-box {
        padding: 30px;
        max-width: min(700px, 85vw);
      }

      h1 {
        font-size: clamp(1.5rem, 2.5vw, 2.2rem);
        padding-bottom: 12px;
        margin-bottom: 16px;
      }

      .quest-box p {
        font-size: clamp(0.85rem, 1.5vw, 1rem);
        margin-bottom: 20px;
      }

      .story-display {
        font-size: clamp(0.95rem, 1.8vw, 1.15rem);
        padding: 22px 24px;
        min-height: 150px;
        margin: 20px 0;
      }

      .btn {
        padding: 14px 26px;
        font-size: clamp(0.95rem, 1.5vw, 1.1rem);
        min-height: 48px;
      }

      .btn-row#choices-panel {
        flex-direction: row;
      }

      .btn-row#choices-panel .btn {
        min-width: 220px;
      }

      .btn-escape {
        font-size: clamp(1rem, 1.5vw, 1.2rem);
        padding: 14px 28px;
      }
    }

    /* Large Desktop (1200px+) - Maximale Readability */
    @media (min-width: 1200px) {
      body {
        padding: 36px;
      }

      .quest-box {
        padding: 36px;
        max-width: min(800px, 75vw);
      }

      h1 {
        font-size: clamp(1.7rem, 2vw, 2.6rem);
        padding-bottom: 14px;
      }

      .quest-box p {
        font-size: clamp(0.95rem, 1.3vw, 1.15rem);
        margin-bottom: 24px;
      }

      .story-display {
        font-size: clamp(1.1rem, 1.5vw, 1.3rem);
        padding: 26px 30px;
        min-height: 180px;
        margin: 24px 0;
        line-height: 1.6;
      }

      .btn {
        padding: 16px 30px;
        font-size: clamp(1.05rem, 1.3vw, 1.25rem);
        min-height: 52px;
      }

      .btn-row#choices-panel {
        flex-direction: row;
      }

      .btn-row#choices-panel .btn {
        min-width: 260px;
      }

      .btn-escape {
        font-size: clamp(1.1rem, 1.3vw, 1.3rem);
        padding: 16px 32px;
      }
    }

    /* Short landscape viewports */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 10px;
      }

      .quest-box {
        padding: 18px;
      }

      h1 {
        font-size: 1.1rem;
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .quest-box p {
        font-size: 0.75rem;
        margin-bottom: 10px;
      }

      .story-display {
        font-size: 0.85rem;
        padding: 12px 16px;
        min-height: 90px;
        margin: 12px 0;
      }

      .btn {
        padding: 10px 18px;
        font-size: 0.85rem;
        min-height: 40px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="quest-box">
    <h1>⚔️ QUEST_LOG: SECTOR_404</h1>
    <p style="color: #888;">Current location: Missing URL index. An anomaly blocks the path forward.</p>
    
    <!-- Central text field for our adventure steps -->
    <div class="story-display" id="story-field">
      You wander into an empty data lane. Suddenly, a wild LEVEL 404 GLITCH encounters you! It blocks your route completely.
    </div>

    <!-- Interface Action Buttons rows -->
    <div class="btn-row" id="choices-panel">
      <button class="btn" onclick="advanceAdventureStep('attack')">⚔️ ATTACK GLITCH</button>
      <button class="btn" onclick="advanceAdventureStep('flee')">🏃 FLEE BACKWARDS</button>
    </div>

    <div class="btn-row">
      <a href="/GachaDeadlines/" class="btn btn-escape hidden" id="escape-link">🏆 CLAIM XP &amp; RETURN HOME</a>
    </div>
  </div>

  <script>
    const storyField = document.getElementById('story-field');
    const choicesPanel = document.getElementById('choices-panel');
    const escapeLink = document.getElementById('escape-link');

    let turnCounter = 0;

    function advanceAdventureStep(actionType) {
      turnCounter++;

      if (actionType === 'flee') {
        // Punish player if they choose to run away
        storyField.innerText = "You tried to flee, but the broken URL layout wraps around infinitely! You run in a loop and land right back in front of the glitch.";
        return;
      }

      // Progression tracking based on attack counters
      if (turnCounter === 1) {
        storyField.innerText = "You swing your mechanical keyboard. Your attack bounces off the firewall! You deal 0 damage. The glitch looks highly unimpressed.";
      } else if (turnCounter === 2) {
        storyField.innerText = "You unleash a localized script exploit! The glitch's health bar drops by 50%. It panics and begins throwing buffer allocation warnings at you!";
      } else {
        // Success final phase transition
        choicesPanel.classList.add('hidden');
        escapeLink.classList.remove('hidden');
        
        storyField.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>CRITICAL_HIT! The glitch collapses into unallocated heap memory. Level Up! The link is clear.</span>";
      }
    }
  </script>

</body>
</html>
