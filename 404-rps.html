<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - AI Duel Protocol</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-rps.css">
</head>

<body>

  <div class="terminal-box">
    <h1>⚔️ PROTOCOL_404: AI_GRID_DUEL</h1>
    <p class="intro-text">The index is locked. Defeat the firewall in a handshake protocol duel to clear the routing path.</p>
    
    <div class="score-board">
      HUMAN: <span id="human-score">0</span> | FIREWALL: <span id="ai-score">0</span>
    </div>

    <div class="log-stream" id="log-box">
      <div class="log-entry">[SYSTEM] Firewall active. Awaiting your Handshake package...</div>
    </div>

    <div class="btn-row" id="interface-box">
      <button class="btn" onclick="playRound('rock')">✊ ROCK</button>
      <button class="btn" onclick="playRound('paper')">✋ PAPER</button>
      <button class="btn" onclick="playRound('scissors')">✌️ SCISSORS</button>
    </div>

    <div class="btn-row">
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 BYPASS_TO_HOME</a>
    </div>
  </div>

  <!-- Script -->
  <script src="404-rps.js"></script>
</body>
</html>
