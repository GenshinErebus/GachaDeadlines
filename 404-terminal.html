<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - Terminal Error</title>
  <!-- Styling -->
  <link rel="stylesheet" href="404-terminal.css">
</head>

<body>


  <div class="terminal" id="terminal">
    <!-- Initial boot sequence output -->
    <div class="output-line">⚠️ STATUS_CODE: 404_PAGE_NOT_FOUND</div>
    <div class="output-line">⟳ F5 · 📱Pull → Another 404</div>
    <div class="output-line">====================================================</div>
    <div class="output-line">Try typing <span style="color: #ffffff;">help</span> at the prompt below ↓</div>
    <div class="output-line">Try: help | joke | facts | tech | gg</div>
    <div class="output-line">====================================================</div>

    <!-- Area where new outputs will be dynamically appended -->
    <div id="history"></div>

    <!-- Active command input line -->
    <div class="input-area">
      <span class="prompt">guest@system:~#</span>
      <input type="text" id="terminal-input" autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

  <!-- Script -->
  <script src="404-terminal.js"></script>

</body>

</html>
