<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Decrypting Secure Link...</title>
  <style>
    /* Retro Terminal Look */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      user-select: none;
      touch-action: manipulation;
    }

    .terminal-box {
      max-width: 600px;
      width: 100%;
      border: 2px solid #00ff33;
      padding: 25px;
      border-radius: 6px;
      background-color: #111;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.25);
      box-sizing: border-box;
    }

    h1 { 
      font-size: 1.6rem; 
      margin-top: 0; 
      border-bottom: 1px dashed rgba(0, 255, 51, 0.3);
      padding-bottom: 10px;
    }

    /* Live scrolling stream log */
    .stream-log {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.4);
      padding: 15px;
      border-radius: 4px;
      font-size: 0.95rem;
      color: #ffffff;
      text-align: left;
      line-height: 1.5;
      margin: 20px 0;
      height: 200px;
      overflow-y: auto;
    }

    .log-line { margin-bottom: 6px; }
    .log-alert { color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }
    .lyrics-line { color: #00ff33; font-weight: bold; text-shadow: 0 0 3px #00ff33; }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px rgba(0, 255, 51, 0.2);
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <h1>📡 PROTOCOL_404: RETRIEVING_BACKUP_NODE</h1>
    <p style="color: #888; font-size: 0.9rem;">The requested link layer is dead. De-encrypting backup server data packets to rebuild routing protocols.</p>
    
    <!-- Scrolling log window -->
    <div class="stream-log" id="log-window">
      <div class="log-line">[SYSTEM] Matrix initialized. Fetching emergency stream payload...</div>
    </div>

    <!-- The emergency exit button unhides instantly -->
    <div class="btn-row">
      <a href="/" class="btn" id="escape-link">🚀 ABORT MEME TRANSMISSION &amp; GO HOME</a>
    </div>
  </div>

  <script>
    const logWindow = document.getElementById('log-window');
    
    let currentLineIdx = 0;
    let textInterval;

    // The Rickroll sequence payload array
    const rickrollPayload = [
      "STATUS: [DECRYPTION_STAGE_1_COMPLETE]",
      "ALERT: Unrecognized music transmission intercepted...",
      "------------------------------------------",
      "We're no strangers to love...",
      "You know the rules and so do I!",
      "A full commitment's what I'm thinking of...",
      "You wouldn't get this from any other guy!",
      "I just wanna tell you how I'm feeling...",
      "Gotta make you understand...",
      "------------------------------------------",
      "NEVER GONNA GIVE YOU UP! 🎤",
      "NEVER GONNA LET YOU DOWN! 🕺",
      "NEVER GONNA RUN AROUND AND DESERT YOU!",
      "NEVER GONNA MAKE YOU CRY! 💧",
      "NEVER GONNA SAY GOODBYE! 👋",
      "NEVER GONNA TELL A LIE AND HURT YOU!",
      "------------------------------------------",
      "STATUS: Connection fully Rickrolled.",
      "Recommendation: Click the button above before it loops."
    ];

    function appendStreamLog(text) {
      const line = document.createElement('div');
      
      // Highlight flags and system logs versus the actual lyrics
      if (text.includes("STATUS:") || text.includes("----------------")) {
        line.className = "log-line";
      } else if (text.includes("ALERT:")) {
        line.className = "log-line log-alert";
      } else {
        line.className = "log-line lyrics-line";
      }
      
      line.innerText = text;
      logWindow.appendChild(line);
      logWindow.scrollTop = logWindow.scrollHeight; // Force scroll to anchor bottom
    }

    function processNextPayloadStep() {
      if (currentLineIdx < rickrollPayload.length) {
        appendStreamLog(rickrollPayload[currentLineIdx]);
        currentLineIdx++;
      } else {
        clearInterval(textInterval); // End sequence cleanly
      }
    }

    // Launch configuration engine sequence with a subtle initialization delay
    setTimeout(function() {
      appendStreamLog("STATUS: Initializing decryptor array...");
      textInterval = setInterval(processNextPayloadStep, 1100); // Prints a new line every 1.1s
    }, 1200);
  </script>

</body>
</html>
