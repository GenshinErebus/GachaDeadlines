<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Grid Locked (Connect 4)</title>
  <style>
    /* Retro Terminal Aesthetic */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      overflow-x: hidden;
      touch-action: manipulation;
      /* Optimizes mobile click responsiveness */
      user-select: none;
    }

    .container {
      text-align: center;
      width: 100vw;
      height: 98vh;
    }

    .header-text {
      margin-bottom: 15px;
      line-height: 1.4;
      font-size: clamp(0.8rem, 2.3vw, 2.3rem);
    }

    .status-panel {
      font-size: clamp(0.9rem, 2.4vw, 2.4rem);
      margin-bottom: 15px;
      min-height: 25px;
    }

    /* 4-in-a-row Grid Board Layout (7 Columns x 6 Rows) */
    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      background-color: #111;
      border: 3px solid #00ff33;
      border-radius: 6px;
      padding: 8px;
      margin: 15px auto;
      width: 35vw;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.3);
    }

    /* Circle Slots */
    .slot {
      aspect-ratio: 1 / 1;
      border: 2px solid rgba(0, 255, 51, 0.4);
      border-radius: 50%;
      background-color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .slot:hover {
      border-color: #00ff33;
      box-shadow: 0 0 8px rgba(0, 255, 51, 0.4);
    }

    /* Player chips colors mapping states safely */
    .slot.player1 {
      background-color: #00ff33;
      border-color: #00ff33;
      box-shadow: 0 0 12px #00ff33;
    }

    .slot.player2 {
      background-color: #ff3333;
      border-color: #ff3333;
      box-shadow: 0 0 12px #ff3333;
    }

    /* Action Buttons */
    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: clamp(0.9rem, 2.4vw, 2.4rem);
      cursor: pointer;
      margin: 8px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none;
    }

    /* ============================================
   DESKTOP LAYOUT (Screens > 768px)
   ============================================ */
    @media (min-width: 48.0625rem) {}

    /* ============================================
   MOBILE LAYOUT (Screens ≤ 768px)
   ============================================ */
    @media (max-width: 48rem) {
      .board {
        width: 85vw;
        /* Make the board significantly wider on mobile screens */
        max-width: 450px;
        /* Prevent the grid from stretching too much */
        gap: 4px;
        /* Reduce spacing between slots slightly for mobile */
        padding: 6px;
        /* Scale down padding to save screen space */
      }

      .container {
        height: auto;
        /* Avoid content cutoff if layout expands vertically */
        min-height: 98vh;
      }
    }


    /* ==========================================================================
       ULTRA-MOBILE RESOLUTIONS (Nested inside max-width: 768px)
       ========================================================================== */
    @media (max-width: 21.8125rem) {
      .board {
        margin-top: -20px;
        width: 80vw;
        /* Make the board significantly wider on mobile screens */
        max-width: 450px;
        /* Prevent the grid from stretching too much */
        gap: 4px;
        /* Reduce spacing between slots slightly for mobile */
        padding: 6px;
        /* Scale down padding to save screen space */
      }

      .container {
        height: 95vh;
        /* Avoid content cutoff if layout expands vertically */
        min-height: 95vh;
      }

      .status-panel {
        font-size: 13px;
      }
  </style>
</head>

<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [GRID_LOCK] ACCESS_DENIED_404</div>
      <div>Establish a 4-node secure baseline sequence to breach the sector.</div>
      <div>Controls: Tap or Click any column grid sector to drop a packet.</div>
    </div>

    <div class="status-panel" id="status-msg">Your turn, User (Green)...</div>

    <!-- The 7x6 Matrix Grid Board -->
    <div class="board" id="game-board"></div>

    <div>
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">RESET TERMINAL</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const boardContainer = document.getElementById('game-board');
    const statusMsg = document.getElementById('status-msg');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');

    const COLS = 7;
    const ROWS = 6;

    let grid = [];
    let gameActive = true;
    const human = 1;
    const ai = 2;

    // Build the grid architecture nodes
    function createBoard() {
      boardContainer.innerHTML = '';
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.dataset.col = c;
          slot.id = `slot-${r}-${c}`;

          // Connect click listener directly to columns physics action
          slot.addEventListener('click', () => handleColumnClick(c));
          boardContainer.appendChild(slot);
        }
      }
    }

    function handleColumnClick(colIndex) {
      if (!gameActive) return;

      // Execute gravity find mechanics to place disk at lowest row slot available
      const rowIndex = getLowestEmptyRow(colIndex);
      if (rowIndex === -1) return; // Column is totally full

      makeMove(rowIndex, colIndex, human);

      if (checkWin(human)) {
        triggerEndState(true);
      } else if (checkDraw()) {
        triggerEndState(false, true);
      } else {
        gameActive = false; // Temporarily block input during AI computing step
        statusMsg.innerText = "AI calculating countermeasures...";
        setTimeout(aiMove, 500);
      }
    }

    function getLowestEmptyRow(colIndex) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r][colIndex] === 0) return r;
      }
      return -1;
    }

    function makeMove(r, c, player) {
      grid[r][c] = player;
      const targetSlot = document.getElementById(`slot-${r}-${c}`);
      targetSlot.classList.add(player === human ? 'player1' : 'player2');
    }

    function aiMove() {
      // AI Priority rules: 1. Win if possible, 2. Block user line, 3. Pick random
      let chosenCol = findStrategicColumn(ai) ?? findStrategicColumn(human) ?? getRandomColumn();

      if (chosenCol !== null) {
        const r = getLowestEmptyRow(chosenCol);
        makeMove(r, chosenCol, ai);

        if (checkWin(ai)) {
          triggerEndState(false);
          return;
        }
      }

      if (checkDraw()) {
        triggerEndState(false, true);
      } else {
        gameActive = true;
        statusMsg.innerText = "Your turn, User (Green)...";
      }
    }

    function findStrategicColumn(player) {
      for (let c = 0; c < COLS; c++) {
        let r = getLowestEmptyRow(c);
        if (r !== -1) {
          grid[r][c] = player; // Mock test move placement simulation
          let winState = checkWin(player);
          grid[r][c] = 0; // Wipe track
          if (winState) return c;
        }
      }
      return null;
    }

    function getRandomColumn() {
      let openCols = [];
      for (let c = 0; c < COLS; c++) {
        if (getLowestEmptyRow(c) !== -1) openCols.push(c);
      }
      if (openCols.length === 0) return null;
      return openCols[Math.floor(Math.random() * openCols.length)];
    }

    function checkWin(player) {
      // 1. Horizontal verification
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r][c + 1] === player && grid[r][c + 2] === player && grid[r][c + 3] === player) return true;
        }
      }
      // 2. Vertical verification
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === player && grid[r + 1][c] === player && grid[r + 2][c] === player && grid[r + 3][c] === player) return true;
        }
      }
      // 3. Diagonal verification (down-right direction)
      for (let r = 0; r < ROWS - 3; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r + 1][c + 1] === player && grid[r + 2][c + 2] === player && grid[r + 3][c + 3] === player) return true;
        }
      }
      // 4. Diagonal verification (up-right direction)
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c < COLS - 3; c++) {
          if (grid[r][c] === player && grid[r - 1][c + 1] === player && grid[r - 2][c + 2] === player && grid[r - 3][c + 3] === player) return true;
        }
      }
      return false;
    }

    function checkDraw() {
      return grid[0].every(val => val !== 0);
    }

    function triggerEndState(humanWon, isDraw = false) {
      gameActive = false;
      resetBtn.classList.remove('hidden');

      if (isDraw) {
        statusMsg.innerText = "GRID_FULL: Neutral tie achieved.";
        escapeBtn.classList.remove('hidden');
      } else if (humanWon) {
        statusMsg.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>BREACH_SUCCESS: Baseline Established!</span>";
        escapeBtn.classList.remove('hidden');
      } else {
        statusMsg.innerHTML = "<span style='color: #ff3333;'>BREACH_FAILED: Firewall locked down!</span>";
      }
    }

    function resetGame() {
      gameActive = true;
      statusMsg.innerText = "Your turn, User (Green)...";
      escapeBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
      createBoard();
    }

    // Launch configuration engine setup
    createBoard();
  </script>
</body>

</html>
