<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Matrix Code-Breaker</title>
  <style>
    /* Retro Terminal Aesthetic - Fully Responsive Design */
    * {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-shadow: 0 0 4px #00ff33;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
    }

    .terminal-box {
      width: 100%;
      border: 2px solid #00ff33;
      padding: 30px;
      border-radius: 8px;
      background-color: #111;
      box-shadow: 0 0 25px rgba(0, 255, 51, 0.3);
      overflow: hidden;
    }

    h1 { 
      font-size: clamp(1rem, 3vw, 2.2rem);
      margin: 0 0 12px 0;
      border-bottom: 1px dashed rgba(0, 255, 51, 0.4);
      padding-bottom: 12px;
      word-wrap: break-word;
      line-height: 1.3;
      text-shadow: 0 0 4px #00ff33;
    }

    .intro-text {
      color: #aaa;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      margin: 0 0 20px 0;
      line-height: 1.5;
      text-shadow: none;
    }

    /* Container for the binary text block - default: umbruchbar (mobile-safe) */
    .binary-stream {
      background-color: #050505;
      border: 1px solid rgba(0, 255, 51, 0.5);
      padding: 15px 20px;
      border-radius: 5px;
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: #ffffff;
      text-shadow: none;
      letter-spacing: 3px;
      margin: 20px 0;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
      white-space: normal;
      word-break: break-all;
      overflow: hidden;
      font-weight: bold;
    }

    .status-panel {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      margin: 15px 0;
      min-height: 1.5em;
      line-height: 1.4;
      font-weight: bold;
    }

    /* Button area layout styling */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 14px 28px;
      font-family: inherit;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      text-shadow: 0 0 4px #00ff33;
      box-shadow: 0 0 8px rgba(0, 255, 51, 0.3);
      text-decoration: none;
      transition: all 0.25s ease;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    .btn:hover, .btn:active {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 25px #00ff33;
      font-weight: bold;
      text-shadow: none;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .escape-btn {
      border: 3px solid #00ff33;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (< 360px) */
    @media (max-width: 359px) {
      body {
        padding: 8px;
      }

      .terminal-box {
        padding: 12px;
        border-width: 1px;
      }

      h1 {
        font-size: 0.9rem;
        margin-bottom: 6px;
        padding-bottom: 8px;
      }

      .intro-text {
        font-size: 0.7rem;
        margin-bottom: 10px;
        line-height: 1.3;
      }

      .binary-stream {
        padding: 6px 8px;
        font-size: 0.75rem;
        letter-spacing: 1px;
        line-height: 1.5;
        min-height: 32px;
      }

      .status-panel {
        font-size: 0.8rem;
        margin: 6px 0;
        min-height: 1.2em;
      }

      .btn {
        padding: 10px 12px;
        font-size: 0.9rem;
        min-height: 40px;
        letter-spacing: 0;
      }

      .btn-row {
        gap: 6px;
        margin-top: 8px;
      }

      .btn-row#interface-box {
        flex-direction: column;
      }

      .btn-row#interface-box .btn {
        width: 100%;
      }
    }

    /* Small Mobile (360px - 480px) */
    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 12px;
      }

      .terminal-box {
        padding: 16px;
      }

      h1 {
        font-size: 1rem;
      }

      .binary-stream {
        padding: 8px;
        font-size: 0.85rem;
        letter-spacing: 2px;
        min-height: 35px;
      }

      .btn-row#interface-box {
        flex-direction: column;
      }

      .btn-row#interface-box .btn {
        width: 100%;
        min-height: 42px;
      }
    }

    /* Tablet (481px - 768px) */
    @media (min-width: 481px) and (max-width: 768px) {
      body {
        padding: 16px;
      }

      .terminal-box {
        padding: 25px;
      }

      .btn-row#interface-box {
        flex-direction: row;
      }

      .btn {
        min-width: 120px;
        min-height: 48px;
      }
    }

    /* Desktop (769px+) */
    @media (min-width: 769px) {
      body {
        padding: 40px;
      }

      .terminal-box {
        padding: 45px;
        max-width: 65vw;
      }

      /* Erst auf Desktop: Binär-Text einzeilig lassen, dort passt er locker */
      .binary-stream {
        white-space: nowrap;
      }

      .btn-row#interface-box {
        flex-direction: row;
      }

      .btn {
        min-width: 160px;
        min-height: 55px;
      }
    }

    /* Large Desktop (1200px+) */
    @media (min-width: 1200px) {
      body {
        padding: 50px;
      }

      .terminal-box {
        padding: 55px;
        max-width: 55vw;
      }

      h1 {
        font-size: 2.5rem;
      }

      .binary-stream {
        font-size: 1.6rem;
        letter-spacing: 4px;
        padding: 20px 30px;
      }

      .btn {
        font-size: 1.5rem;
        min-width: 180px;
        min-height: 60px;
        padding: 18px 35px;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      .btn, * {
        transition: none !important;
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <h1>🔐 DECRYPTION_KEY_REQUIRED (404)</h1>
    <p class="intro-text">Decode the binary stream to bypass the firewall.</p>
    
    <!-- Visual area where the zeros and ones are printed -->
    <div class="binary-stream" id="binary-display">00000000</div>

    <div class="status-panel" id="status-msg">Select the correct decryption cipher:</div>

    <!-- Interface area for interaction buttons -->
    <div class="btn-row" id="interface-box">
      <button class="btn" id="choice-0" onclick="verifyDecryption(0)">---</button>
      <button class="btn" id="choice-1" onclick="verifyDecryption(1)">---</button>
      <button class="btn" id="choice-2" onclick="verifyDecryption(2)">---</button>
    </div>

    <!-- Final escape protocol anchor link triggered on success -->
    <div class="btn-row">
      <a href="/GachaDeadlines/" class="btn escape-btn hidden" id="escape-link">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const binaryDisplay = document.getElementById('binary-display');
    const statusMsg = document.getElementById('status-msg');
    const interfaceBox = document.getElementById('interface-box');
    const escapeLink = document.getElementById('escape-link');

    const wordPool = ["HOME", "EXIT", "LINK", "NODE", "SUDO", "ROOT", "DATA", "CODE", "HOST", "PORT", "GRID"];
    
    let correctAnswer = "";
    let choices = [];
    let gameActive = true;

    function convertTextToBinary(text) {
      let output = [];
      for (let i = 0; i < text.length; i++) {
        let bin = text.charCodeAt(i).toString(2);
        let padded = "00000000".substring(bin.length) + bin;
        output.push(padded);
      }
      return output.join(" ");
    }

    function FisherYatesShuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        let temp = array[currentIndex];
        array[currentIndex] = array[randomIndex];
        array[randomIndex] = temp;
      }
      return array;
    }

    function initCodeBreaker() {
      gameActive = true;
      statusMsg.innerHTML = "Select the correct decryption cipher:";
      escapeLink.classList.add('hidden');
      interfaceBox.classList.remove('hidden');

      const randomIndex = Math.floor(Math.random() * wordPool.length);
      correctAnswer = wordPool[randomIndex];

      binaryDisplay.innerText = convertTextToBinary(correctAnswer);

      let decoys = wordPool.filter(w => w !== correctAnswer);
      decoys = FisherYatesShuffle(decoys);

      choices = [correctAnswer, decoys[0], decoys[1]];
      choices = FisherYatesShuffle(choices);

      for (let i = 0; i < 3; i++) {
        document.getElementById("choice-" + i).innerText = choices[i];
      }
    }

    function verifyDecryption(selectedIndex) {
      if (!gameActive) return;

      const userChoice = choices[selectedIndex];

      if (userChoice === correctAnswer) {
        gameActive = false;
        statusMsg.innerHTML = "<span style='color: #00ff33; font-weight: bold;'>DECRYPTION_SUCCESS: Unlocked!</span>";
        interfaceBox.classList.add('hidden');
        escapeLink.classList.remove('hidden');
      } else {
        statusMsg.innerHTML = "<span style='color: #ff3333;'>CIPHER_MISMATCH: Re-routing...</span>";
        gameActive = false;
        setTimeout(initCodeBreaker, 1200);
      }
    }

    initCodeBreaker();
  </script>

</body>
</html>
