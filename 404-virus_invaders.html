<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Virus Invaders</title>
  <style>
    /* Retro Terminal Look */
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-shadow: 0 0 5px #00ff33;
      overflow: hidden;
      touch-action: none; /* Disables smartphone browser pulling gestures */
      user-select: none;
    }

    .container {
      text-align: center;
      max-width: 650px;
      width: 100%;
    }

    .header-text {
      margin-bottom: 15px;
      line-height: 1.4;
      font-size: 0.9rem;
    }

    .score-board {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    /* Game Screen Canvas Box */
    canvas {
      background-color: #111;
      border: 3px solid #00ff33;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.3);
      display: block;
      margin: 15px auto;
      max-width: 100%;
      height: auto;
    }

    /* Action Buttons */
    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      margin: 10px;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [MALWARE_ALERT] S_CORE CORRUPTED BY VIRUSES</div>
      <div>Purge all malicious invaders to restore core website paths.</div>
      <div>Controls: Slide Finger / Move Mouse to position your shield.</div>
    </div>

    <div class="score-board">
      VIRUSES THWARTED: <span id="current-score">0</span> / 12
    </div>

    <!-- The Space Matrix Board Screen -->
    <canvas id="invadersCanvas" width="480" height="400"></canvas>

    <div>
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT SYSTEM</button>
      <a href="/" class="btn hidden" id="escape-btn">🚀 RUN EMERGENCY_ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('invadersCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('current-score');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Engine settings
    let score = 0;
    let isGameOver = false;
    let isWin = false;
    let bullets = [];
    let enemies = [];
    let lastShotTime = 0;
    const shotInterval = 350; // Auto-firing delay rate in ms

    // Defender Shield Config
    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 30,
      width: 40,
      height: 12
    };

    // --- RESPONSIVE CONTROLS CONTROLLER ---

    function handleInputX(clientX) {
      if (isGameOver) return;
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      
      // Scale resolution back to match bounding grids
      const canvasScaleFactor = canvas.width / rect.width;
      const targetX = relativeX * canvasScaleFactor;
      
      // Bind horizontal locks
      player.x = Math.max(0, Math.min(canvas.width - player.width, targetX - player.width / 2));
    }

    // Desktop mouse tracker links
    canvas.addEventListener('mousemove', (e) => handleInputX(e.clientX));

    // Smartphone slider fingers mechanics
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length > 0) {
        handleInputX(e.touches[0].clientX);
      }
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isGameOver) {
        resetGame();
      } else if (e.touches.length > 0) {
        handleInputX(e.touches[0].clientX);
      }
    }, { passive: false });

    // Keyboard fail-safe fallback options
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.x = Math.max(0, player.x - 15);
      if (e.key === 'ArrowRight' || e.key === 'd') player.x = Math.min(canvas.width - player.width, player.x + 15);
    });

    canvas.addEventListener('click', () => { if (isGameOver) resetGame(); });

    // --- GAME ENGINE SETUP ---

    function initEnemies() {
      enemies = [];
      const rows = 3;
      const cols = 4;
      const eWidth = 40;
      const eHeight = 20;
      
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: c * (eWidth + 35) + 50,
            y: r * (eHeight + 20) + 40,
            width: eWidth,
            height: eHeight,
            direction: 1,
            speed: 1.2
          });
        }
      }
    }

    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    function update() {
      if (isGameOver) return;

      const currentTime = Date.now();
      
      // 1. Auto-fire laser management cycles
      if (currentTime - lastShotTime > shotInterval) {
        bullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y - 10,
          width: 4,
          height: 10,
          speed: 5
        });
        lastShotTime = currentTime;
      }

      // 2. Drive bullet tracks up
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
        }
      }

      // 3. Move Virus clusters
      let changeDir = false;
      enemies.forEach(e => {
        e.x += e.direction * e.speed;
        if (e.x <= 0 || e.x + e.width >= canvas.width) {
          changeDir = true;
        }
      });

      if (changeDir) {
        enemies.forEach(e => {
          e.direction *= -1;
          e.y += 15; // Shift downwards towards player
          
          // Breach boundary loss checking
          if (e.y + e.height >= player.y) {
            isGameOver = true;
            isWin = false;
          }
        });
      }

      // 4. Compute laser impact targets
      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
          if (checkCollision(bullets[bIdx], enemies[eIdx])) {
            bullets.splice(bIdx, 1);
            enemies.splice(eIdx, 1);
            score++;
            scoreEl.innerText = score;
            
            // Win validation checks
            if (enemies.length === 0) {
              isGameOver = true;
              isWin = true;
              escapeBtn.classList.remove('hidden');
            }
            break;
          }
        }
      }

      if (isGameOver && !isWin) {
        resetBtn.classList.remove('hidden');
      }
    }

    function draw() {
      // Refresh screen matrix box
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff33';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff33';

      // Draw active player shield block
      if (!isGameOver || isWin) {
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      // Draw firing lasers
      ctx.fillStyle = '#00ff33';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // Draw active Virus invaders
      ctx.font = '16px "Courier New"';
      ctx.textAlign = 'center';
      enemies.forEach(e => {
        ctx.fillText('👾', e.x + e.width / 2, e.y + e.height / 2 + 5);
      });

      // Overlay Display State Windows
      if (isGameOver) {
        if (isWin) {
          ctx.fillStyle = '#00ff33';
          ctx.shadowColor = '#00ff33';
          ctx.font = '20px "Courier New"';
          ctx.fillText('SYSTEM_CLEANSED!', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '14px "Courier New"';
          ctx.fillText('Firewall breached. Run Escape execution.', canvas.width / 2, canvas.height / 2 + 15);
        } else {
          ctx.fillStyle = '#ff3333';
          ctx.shadowColor = '#ff3333';
          ctx.font = '20px "Courier New"';
          ctx.fillText('💥 BREAK_IN_DETECTED 💥', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '14px "Courier New"';
          ctx.fillText('Tap or Click Reboot to try again', canvas.width / 2, canvas.height / 2 + 15);
        }
      }

      ctx.shadowBlur = 0; // Performance optimization cleanup
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      isWin = false;
      bullets = [];
      escapeBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
      player.x = canvas.width / 2 - 20;
      initEnemies();
    }

    // Engine initialization startup
    initEnemies();
    gameLoop();
  </script>

</body>
</html>
