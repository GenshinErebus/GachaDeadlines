<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Virus Invaders</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      background-color: #050505;
      color: #00ff33;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-shadow: 0 0 5px #00ff33;
      touch-action: none;
      user-select: none;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      padding: clamp(5px, 2vw, 25px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(5px, 2vw, 20px);
      min-height: 100vh;
    }

    .header-text {
      text-align: center;
      line-height: 1.3;
      word-wrap: break-word;
      padding: 0 clamp(3px, 2vw, 15px);
      max-width: 100%;
    }

    .header-text div:first-child {
      font-size: clamp(0.65rem, 5vw, 2rem);
      margin-bottom: clamp(2px, 1vw, 8px);
      letter-spacing: 0.5px;
    }

    .header-text div:nth-child(2),
    .header-text div:last-child {
      font-size: clamp(0.5rem, 3vw, 1rem);
      opacity: 0.9;
    }

    .score-board {
      font-size: clamp(0.55rem, 2.5vw, 1rem);
      margin-bottom: 5px;
      text-align: center;
      white-space: nowrap;
      padding: 0 10px;
    }

    /* Responsive Canvas */
    canvas {
      background-color: #111;
      border: 3px solid #00ff33;
      border-radius: 6px;
      box-shadow: 0 0 20px rgba(0, 255, 51, 0.3);
      display: block;
      margin: 0 auto;
      width: clamp(160px, 85vw, 500px);
      height: auto;
      touch-action: none;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(5px, 2vw, 15px);
      justify-content: center;
      width: 100%;
      max-width: 500px;
      padding: 0 clamp(5px, 2vw, 15px);
    }

    .btn {
      background: transparent;
      border: 2px solid #00ff33;
      color: #00ff33;
      padding: clamp(6px, 2vw, 12px) clamp(10px, 2.5vw, 20px);
      font-family: inherit;
      font-size: clamp(0.6rem, 3vw, 1rem);
      cursor: pointer;
      border-radius: 4px;
      text-shadow: 0 0 5px #00ff33;
      box-shadow: 0 0 5px #00ff33;
      transition: all 0.3s;
      text-decoration: none;
      flex: 1 1 auto;
      min-width: 110px;
      text-align: center;
      white-space: normal;
      word-break: break-word;
      line-height: 1.2;
    }

    .btn:hover {
      background: #00ff33;
      color: #050505;
      box-shadow: 0 0 15px #00ff33;
    }

    .hidden {
      display: none !important;
    }

    /* Ultra Small Mobile (<380px height or <350px width) */
    @media (max-height: 380px), (max-width: 350px) {
      .container {
        padding: 5px;
        gap: 3px;
      }

      .header-text {
        max-height: 35px;
        overflow: hidden;
      }

      .header-text div:first-child {
        font-size: 0.7rem;
        margin-bottom: 2px;
      }

      .header-text div:nth-child(2) {
        font-size: 0.5rem;
      }

      .header-text div:last-child {
        display: none;
      }

      .score-board {
        font-size: 0.52rem;
        margin-bottom: 3px;
        white-space: normal;
        word-break: break-word;
      }

      canvas {
        width: 220px;
        border-width: 2px;
      }

      .button-group {
        gap: 3px;
        padding: 3px;
        margin-top: 5px;
      }

      .btn {
        padding: 4px 8px;
        font-size: 0.55rem;
        min-width: 95px;
        max-width: 47%;
        border-width: 1.5px;
      }
    }

    /* Small Mobile (381-480px height) */
    @media (min-height: 381px) and (max-height: 480px) {
      .container {
        gap: 5px;
      }

      .header-text div:last-child {
        display: none;
      }

      canvas {
        width: 260px;
      }

      .btn {
        min-width: 100px;
        padding: 5px 10px;
      }
    }

    /* Medium Mobile (481-700px height) */
    @media (min-height: 481px) and (max-width: 600px) {
      .container {
        gap: 8px;
      }

      canvas {
        width: 340px;
      }

      .header-text div:last-child {
        display: block;
      }
    }

    /* Tablet */
    @media (min-width: 601px) and (max-width: 1023px) {
      .container {
        justify-content: center;
        max-width: 800px;
      }

      canvas {
        width: 420px;
      }

      .header-text div:first-child {
        font-size: 1.6rem;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .container {
        max-width: 1000px;
        justify-content: center;
        gap: 15px;
      }

      canvas {
        width: 480px;
      }

      .header-text div:first-child {
        font-size: 2rem;
      }

      .btn {
        min-width: 140px;
        padding: 10px 18px;
      }
    }

    /* Large Desktop */
    @media (min-width: 1440px) {
      canvas {
        width: 550px;
      }

      .container {
        max-width: 1200px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-text">
      <div>⚠️ [MALWARE_ALERT] CORE CORRUPTED</div>
      <div>Purge all malicious invaders to restore core paths.</div>
      <div>Slide finger/mouse to position your shield.</div>
    </div>

    <div class="score-board">
      VIRUSES THWARTED: <span id="current-score">0</span>/12
    </div>

    <!-- Canvas with responsive display size but fixed internal resolution -->
    <canvas id="invadersCanvas" width="480" height="400"></canvas>

    <div class="button-group">
      <button class="btn hidden" id="reset-btn" onclick="resetGame()">REBOOT</button>
      <a href="/GachaDeadlines/" class="btn hidden" id="escape-btn">🚀 ESCAPE.EXE</a>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('invadersCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('current-score');
    const escapeBtn = document.getElementById('escape-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Engine settings
    let score = 0;
    let isGameOver = false;
    let isWin = false;
    let bullets = [];
    let enemies = [];
    let lastShotTime = 0;
    const shotInterval = 350;

    // Get current display dimensions for responsive calculations
    function getDisplaySize() {
      const rect = canvas.getBoundingClientRect();
      return { width: rect.width, height: rect.height };
    }

    // Scale player to canvas display size
    function getPlayerSize(displayWidth) {
      const scaleX = displayWidth / canvas.width;
      return {
        width: 40 * scaleX,
        height: 12 * scaleX,
        offsetX: 20 * scaleX
      };
    }

    let player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 30,
      width: 40,
      height: 12
    };

    function handleInputX(clientX) {
      if (isGameOver) return;
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      const displayWidth = rect.width;
      
      const playerSize = getPlayerSize(displayWidth);
      const targetX = relativeX * (canvas.width / displayWidth);

      player.x = Math.max(0, Math.min(canvas.width - player.width, targetX - playerSize.offsetX));
    }

    canvas.addEventListener('mousemove', (e) => handleInputX(e.clientX));

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length > 0) handleInputX(e.touches[0].clientX);
    }, { passive: false });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isGameOver) resetGame();
      else if (e.touches.length > 0) handleInputX(e.touches[0].clientX);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.x = Math.max(0, player.x - 15);
      if (e.key === 'ArrowRight' || e.key === 'd') player.x = Math.min(canvas.width - player.width, player.x + 15);
    });

    canvas.addEventListener('click', () => { if (isGameOver) resetGame(); });

    function initEnemies() {
      enemies = [];
      const rows = 3;
      const cols = 4;
      const eWidth = 40;
      const eHeight = 20;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          enemies.push({
            x: c * (eWidth + 35) + 50,
            y: r * (eHeight + 20) + 40,
            width: eWidth,
            height: eHeight,
            direction: 1,
            speed: 1.2
          });
        }
      }
    }

    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y;
    }

    function update() {
      if (isGameOver) return;

      const currentTime = Date.now();

      if (currentTime - lastShotTime > shotInterval) {
        bullets.push({
          x: player.x + player.width / 2 - 2,
          y: player.y - 10,
          width: 4,
          height: 10,
          speed: 5
        });
        lastShotTime = currentTime;
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      let changeDir = false;
      enemies.forEach(e => {
        e.x += e.direction * e.speed;
        if (e.x <= 0 || e.x + e.width >= canvas.width) changeDir = true;
      });

      if (changeDir) {
        enemies.forEach(e => {
          e.direction *= -1;
          e.y += 15;
          if (e.y + e.height >= player.y) {
            isGameOver = true;
            isWin = false;
          }
        });
      }

      for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
        for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
          if (checkCollision(bullets[bIdx], enemies[eIdx])) {
            bullets.splice(bIdx, 1);
            enemies.splice(eIdx, 1);
            score++;
            scoreEl.innerText = score;

            if (enemies.length === 0) {
              isGameOver = true;
              isWin = true;
              escapeBtn.classList.remove('hidden');
            }
            break;
          }
        }
      }

      if (isGameOver && !isWin) resetBtn.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff33';
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ff33';

      if (!isGameOver || isWin) {
        ctx.fillRect(player.x, player.y, player.width, player.height);
      }

      ctx.fillStyle = '#00ff33';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      ctx.font = '16px "Courier New"';
      ctx.textAlign = 'center';
      enemies.forEach(e => {
        ctx.fillText('👾', e.x + e.width / 2, e.y + e.height / 2 + 5);
      });

      if (isGameOver) {
        if (isWin) {
          ctx.fillStyle = '#00ff33';
          ctx.shadowColor = '#00ff33';
          ctx.font = '20px "Courier New"';
          ctx.fillText('SYSTEM CLEANSED!', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '14px "Courier New"';
          ctx.fillText('Run Escape execution.', canvas.width / 2, canvas.height / 2 + 15);
        } else {
          ctx.fillStyle = '#ff3333';
          ctx.shadowColor = '#ff3333';
          ctx.font = '20px "Courier New"';
          ctx.fillText('BREAK IN DETECTED!', canvas.width / 2, canvas.height / 2 - 10);
          ctx.font = '14px "Courier New"';
          ctx.fillText('Tap Reboot to try again', canvas.width / 2, canvas.height / 2 + 15);
        }
      }

      ctx.shadowBlur = 0;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      isWin = false;
      bullets = [];
      escapeBtn.classList.add('hidden');
      resetBtn.classList.add('hidden');
      
      const displayWidth = canvas.getBoundingClientRect().width;
      const playerSize = getPlayerSize(displayWidth);
      player.width = 40;
      player.height = 12;
      player.x = canvas.width / 2 - 20;
      player.y = canvas.height - 30;
      
      initEnemies();
    }

    function handleResize() {
      if (!isGameOver) {
        const displayWidth = canvas.getBoundingClientRect().width;
        const playerSize = getPlayerSize(displayWidth);
        player.width = 40;
        player.height = 12;
        player.x = Math.min(player.x, canvas.width - player.width);
      }
    }

    window.addEventListener('resize', handleResize);
    initEnemies();
    gameLoop();
  </script>

</body>
</html>
