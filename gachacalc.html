<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gacha Pull Calculator</title>
   <link rel="stylesheet" href="gachacalc.css">
</head>
<body>
  <!-- Main container -->
  <div class="wrap">
    <!-- Header bar with title and clock -->
    <div class="topbar">
      <span class="title">- Select a Game -</span>
      <span class="clock" id="clock">--:--</span>
    </div>

    <!-- Game selection list -->
    <div class="gamelist" id="gameList"></div>

    <!-- Input fields section -->
    <div class="input-section hidden" id="inputSection">
      <form id="calculatorForm">
        <div class="row">
          <div class="field">
            <label id="ticketLabel"></label>
            <input type="number" id="ticketInput" min="0" step="1" placeholder="0" autocomplete="off" />
          </div>
          <div class="field">
            <label id="currencyLabel"></label>
            <input type="number" id="currencyInput" min="0" step="1" placeholder="0" autocomplete="off" />
          </div>
        </div>
        <div class="btn-group">
          <button type="submit" class="action-btn">Calculate Total Pulls</button>
          <button type="button" class="action-btn reset-btn" id="resetBtn">Reset Data</button>
        </div>
      </form>
      <div class="status info hidden" id="statusMsg"></div>
    </div>

    <!-- Results display section -->
    <div class="result-section hidden" id="resultSection">
      <div class="result-header">Total Available Pulls</div>
      <div class="result-main" id="resultMain">-</div>
      <div class="result-sub" id="resultSub"></div>        
    </div>
    <a href="index.html" class="back-link">← Back to Main Page</a>
  </div>

<script src="gachacalc.js"></script>

</body>
</html>
